<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application submitted — Surmount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<link rel="stylesheet" href="./transitions.css?v=55">
<script src="./transitions.js?v=55" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}

:root{
  --color-bg-primary:#ffffff;
  --color-bg-primary-hover:#fafafa;
  --color-bg-secondary:#fafafa;

  --color-fg-primary-900:#181d27;
  --color-fg-secondary-700:#414651;
  --color-fg-secondary-hover:#252b37;
  --color-fg-tertiary-600:#535862;
  --color-fg-quaternary-400:#a4a7ae;

  --color-text-primary-900:#181d27;
  --color-text-secondary-700:rgba(10,13,18,0.7);
  --color-text-secondary-hover:rgba(10,13,18,0.8);
  --color-text-tertiary-600:#535861;
  --color-text-white:#ffffff;

  --color-border-primary:#00000017;
  --color-border-secondary:rgba(0,0,0,0.06);

  --color-utility-gray-50:#fafafa;
  --color-utility-brand-50:#f1f6fd;
  --color-utility-brand-200:#c8dbf5;
  --color-utility-brand-700:#3757be;

  --spacing-xxs:2px; --spacing-xs:4px; --spacing-sm:6px;
  --spacing-md:8px;  --spacing-lg:12px; --spacing-xl:16px;
  --spacing-2xl:20px; --spacing-3xl:24px; --spacing-4xl:32px;
  --spacing-5xl:40px; --spacing-6xl:48px; --spacing-7xl:64px;

  --radius-md:8px; --radius-xl:12px; --radius-full:9999px;

  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-xs:12px;  --line-height-text-xs:18px;
  --font-size-text-sm:14px;  --line-height-text-sm:20px;
  --font-size-text-md:16px;  --line-height-text-md:24px;
  --font-size-text-lg:18px;  --line-height-text-lg:28px;
  --font-size-display-xs:24px; --line-height-display-xs:32px;
  --font-size-display-sm:30px; --line-height-display-sm:38px;
  --font-size-display-md:36px; --line-height-display-md:44px;
  --font-size-display-lg:48px; --line-height-display-lg:60px;
}

html,body{height:100%}
body{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);
  color:var(--color-fg-primary-900);
  background:var(--color-utility-gray-50);
  letter-spacing:-0.5px;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ─── Topbar ──────────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--spacing-xl) var(--spacing-3xl);
  background:var(--color-utility-gray-50);
}
/* Hidden Back spacer so the brand stays centered */
.topbar-back{
  opacity:0;pointer-events:none;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
}
.topbar-back svg{width:20px;height:20px;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:var(--spacing-md);color:var(--color-fg-primary-900)}
.topbar-brand svg{width:28px;height:28px;display:block}
.topbar-brand-name{
  font-family:var(--font-family-display);
  font-size:20px;font-weight:500;letter-spacing:-0.4px;
}
.topbar-close{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
  transition:background 150ms ease,color 150ms ease;
}
.topbar-close:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.topbar-close:active{transform:scale(0.97)}
.topbar-close svg{width:20px;height:20px;flex-shrink:0}

/* ─── Main ────────────────────────────────────────────────────────────── */
main{
  flex:1;display:grid;place-items:center;
  padding:var(--spacing-3xl);
  min-height:0;
}

/* ─── Loading state ───────────────────────────────────────────────────── */
.loading{
  display:flex;flex-direction:column;align-items:center;
  gap:var(--spacing-3xl);
}
.spinner{
  width:48px;height:48px;
  border-radius:50%;
  border:3px solid rgba(10,13,18,0.08);
  border-top-color:var(--color-fg-primary-900);
  animation:spin 700ms linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-lg);font-weight:500;letter-spacing:-0.4px;
  color:var(--color-fg-primary-900);
}

/* ─── Success state ───────────────────────────────────────────────────── */
.success{
  display:flex;flex-direction:column;align-items:center;
  gap:var(--spacing-4xl);
  width:100%;max-width:720px;
  text-align:center;
}

/* Status pill — white "live" chip with a brand-colored dot. The dot
 * gently breathes (scale + opacity) to signal the application is being
 * actively reviewed without grabbing attention. */
.status-pill{
  display:inline-flex;align-items:center;gap:var(--spacing-md);
  padding:var(--spacing-sm) var(--spacing-lg);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-secondary);
  border-radius:var(--radius-full);
  box-shadow:0 2px 12px rgba(10,13,18,0.03);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:400;letter-spacing:-0.2px;
  color:var(--color-text-primary-900);
}
.status-pill::before{
  content:"";
  width:10px;height:10px;border-radius:50%;
  background:var(--color-utility-brand-700);
  flex-shrink:0;
  /* The dot itself stays still — a soft, blurry brand-colored halo
   * breathes around it via animated box-shadow (blur + spread). */
  animation:surm-halo 2400ms ease-in-out infinite;
}
@keyframes surm-halo{
  /* Inner ring stays nearly static — just a thin 1px → 2px hairline at
   * a constant low alpha. The visible breathing comes from the outer
   * glow's blur + spread oscillation. */
  0%, 100% {
    box-shadow: 0 0 0 1px rgba(55, 87, 190, 0.18),
                0 0 6px 3px rgba(55, 87, 190, 0.12);
  }
  50% {
    box-shadow: 0 0 0 2px rgba(55, 87, 190, 0.18),
                0 0 10px 6px rgba(55, 87, 190, 0.20);
  }
}
@media (prefers-reduced-motion:reduce){
  .status-pill::before{
    animation:none;
    box-shadow: 0 0 0 1px rgba(55, 87, 190, 0.18),
                0 0 8px 4px rgba(55, 87, 190, 0.14);
  }
}

.hero{
  display:flex;flex-direction:column;align-items:center;gap:var(--spacing-lg);
  width:100%;
}
.title{
  font-family:var(--font-family-body);
  font-size:var(--font-size-display-lg);font-weight:500;
  line-height:var(--line-height-display-lg);letter-spacing:-1.2px;
  color:var(--color-fg-primary-900);
  max-width:680px;
}
.subtitle{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:400;
  line-height:var(--line-height-text-md);letter-spacing:-0.3px;
  color:var(--color-fg-tertiary-600);
  max-width:560px;
}

/* Questions footer — sits beneath the CTAs */
.questions-line{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:400;letter-spacing:-0.2px;
  color:var(--color-fg-tertiary-600);
  margin-top:var(--spacing-md);
}
.questions-line a{
  color:var(--color-fg-primary-900);
  text-decoration:underline;text-underline-offset:3px;
  text-decoration-thickness:1px;
  transition:color 150ms ease;
}
.questions-line a:hover{color:var(--color-fg-secondary-hover)}

/* ─── CTA ─────────────────────────────────────────────────────────────── */
.cta-row{
  display:flex;align-items:center;gap:var(--spacing-md);
}
.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-fg-primary-900);
  color:var(--color-text-white);
  border:2px solid rgba(255,255,255,0.12);
  border-radius:var(--radius-md);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:-0.2px;
  transition:background 150ms ease,transform 120ms ease;
  min-width:160px;
}
.cta:hover{background:var(--color-fg-secondary-hover)}
.cta:active{transform:scale(0.99)}
.cta svg{width:20px;height:20px}
.cta-secondary{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  color:var(--color-text-secondary-700);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:-0.2px;
  transition:background 150ms ease,color 150ms ease,transform 120ms ease;
  min-width:160px;
}
.cta-secondary:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.cta-secondary:active{transform:scale(0.99)}

/* ─── State swap (loading → success) ─────────────────────────────────── */
.state{transition:opacity 240ms ease;}
.state[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .spinner{animation-duration:0ms}
  .state{transition:none}
}

/* Stack the CTA pair on narrow viewports so neither button crowds */
@media (max-width: 520px){
  .cta-row{flex-direction:column;width:100%;}
  .cta-row .cta,.cta-row .cta-secondary{width:100%}
  .title{font-size:var(--font-size-display-md);line-height:var(--line-height-display-md);}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="topbar-back" aria-hidden="true" tabindex="-1">
    <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="256" height="256" fill="none"/><line x1="216" y1="128" x2="40" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><polyline points="112 56 40 128 112 200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>
    <span>Back</span>
  </button>
  <div class="topbar-brand">
    <svg width="28" height="28" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 14.8C3 10.3196 3 8.07937 3.87195 6.36808C4.63893 4.86278 5.86278 3.63893 7.36808 2.87195C9.07937 2 11.3196 2 15.8 2H22.2C26.6804 2 28.9206 2 30.6319 2.87195C32.1372 3.63893 33.3611 4.86278 34.1281 6.36808C35 8.07937 35 10.3196 35 14.8V21.2C35 25.6804 35 27.9206 34.1281 29.6319C33.3611 31.1372 32.1372 32.3611 30.6319 33.1281C28.9206 34 26.6804 34 22.2 34H15.8C11.3196 34 9.07937 34 7.36808 33.1281C5.86278 32.3611 4.63893 31.1372 3.87195 29.6319C3 27.9206 3 25.6804 3 21.2V14.8Z" fill="url(#p0)"/><path d="M18.9982 13.1366C18.7314 13.3201 18.4774 13.5264 18.2363 13.7556L17.0473 14.888C16.5042 14.6108 15.9021 14.473 15.3023 14.473C14.3537 14.473 13.4058 14.8171 12.6831 15.5054C11.9844 16.1725 11.5993 17.0568 11.5993 17.9994H9C9 16.3954 9.65481 14.888 10.8462 13.7556C13.064 11.6435 16.537 11.4371 19.0006 13.1366H18.9982Z" fill="url(#p1)"/><path d="M23.3671 18.8083L20.9498 21.1103L19.7607 22.2421C19.5196 22.4719 19.2657 22.6782 18.9982 22.8617C17.9016 23.6185 16.6008 23.9981 15.3023 23.9981C13.6884 23.9981 12.0745 23.4122 10.8462 22.2421C9.65481 21.108 9 19.6006 9 17.9972H11.5993C11.5993 18.9392 11.9844 19.8258 12.6831 20.4906C13.916 21.6647 15.8102 21.8357 17.238 21.0039C17.4809 20.8622 17.7109 20.6913 17.9233 20.4906L19.2306 19.2462L21.5279 17.0586H21.5297C22.0376 16.5727 22.8615 16.5727 23.3671 17.0569C23.8751 17.5405 23.8751 18.3242 23.3671 18.8061V18.8083Z" fill="url(#p2)"/><path d="M28.9994 17.999H26.4001C26.4001 17.0564 26.015 16.1726 25.3164 15.505C24.5937 14.8173 23.6457 14.4732 22.6971 14.4732C22.0248 14.4732 21.353 14.6464 20.7614 14.9922C20.5185 15.134 20.2886 15.3049 20.0785 15.505L18.7689 16.7523L16.4697 18.9416C16.2158 19.1834 15.8828 19.3046 15.5498 19.3046C15.2169 19.3046 14.8839 19.1834 14.63 18.9416C14.122 18.458 14.122 17.6737 14.63 17.1918L17.0479 14.8899L18.237 13.7581C18.4775 13.5283 18.7314 13.322 18.9988 13.1385C21.4624 11.439 24.9331 11.6454 27.1515 13.7581C28.3423 14.8922 28.9971 16.3996 28.9971 18.0013L28.9994 17.999Z" fill="url(#p3)"/><path d="M29 17.9991C29 19.6025 28.3452 21.1099 27.1538 22.2445C25.9255 23.4141 24.3116 24 22.6977 24C21.3992 24 20.0984 23.6204 19.0012 22.8636C19.2686 22.6801 19.5226 22.4738 19.7631 22.2445L20.9521 21.1122C21.4952 21.3894 22.0956 21.5272 22.6977 21.5272C23.6457 21.5272 24.5937 21.183 25.3163 20.4948C26.015 19.8277 26.4007 18.944 26.4007 18.0014H29V17.9991Z" fill="url(#p4)"/><defs><linearGradient id="p0" x1="3" y1="2" x2="35" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#F5F7FA"/><stop offset="1" stop-color="#C3CFE2"/></linearGradient><linearGradient id="p1" x1="9" y1="14.9848" x2="19.0001" y2="15.0677" gradientUnits="userSpaceOnUse"><stop stop-color="#34A6ED"/><stop offset="1" stop-color="#1047D2"/></linearGradient><linearGradient id="p2" x1="9" y1="20.3279" x2="23.747" y2="20.476" gradientUnits="userSpaceOnUse"><stop stop-color="#34A6ED"/><stop offset="1" stop-color="#54E3DF"/></linearGradient><linearGradient id="p3" x1="14.249" y1="15.6351" x2="28.9983" y2="15.7833" gradientUnits="userSpaceOnUse"><stop stop-color="#54E3DF"/><stop offset="1" stop-color="#34A6ED"/></linearGradient><linearGradient id="p4" x1="19.0012" y1="20.9846" x2="28.9996" y2="21.0675" gradientUnits="userSpaceOnUse"><stop stop-color="#1047D2"/><stop offset="1" stop-color="#34A6ED"/></linearGradient></defs></svg>
    <span class="topbar-brand-name">Surmount</span>
  </div>
  <button class="topbar-close" type="button" onclick="location.href='../home/homepage.html'">
    <span>Close</span>
    <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="256" height="256" fill="none"/><line x1="200" y1="56" x2="56" y2="200" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="200" y1="200" x2="56" y2="56" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>
  </button>
</header>

<main>
  <!-- Loading state — shown first while the application "submits" -->
  <div class="state loading" id="state-loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p class="loading-text">Submitting your application…</p>
  </div>

  <!-- Success state — revealed after the loading delay -->
  <div class="state success" id="state-success" hidden>
    <span class="status-pill">Application in review</span>

    <div class="hero">
      <h1 class="title">You're in, Shawn</h1>
      <p class="subtitle">We'll review your application within 1–2 business days and email you the moment you're approved. Connect your bank now so you're ready to invest the second you're in.</p>
    </div>

    <div class="cta-row">
      <button class="cta-secondary" type="button" onclick="location.href='../home/homepage.html'">Maybe later</button>
      <button class="cta" type="button" onclick="location.href='./link-bank.html'">
        <span>Connect your bank</span>
        <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="256" height="256" fill="none"/><line x1="40" y1="128" x2="216" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><polyline points="144 56 216 128 144 200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>
      </button>
    </div>

    <p class="questions-line">Questions? <a href="mailto:support@surmount.ai">support@surmount.ai</a></p>
  </div>
</main>

<script>
// Two-second submit simulation, then reveal the success state with a soft
// fade. Reduced-motion users get an instant swap.
(function(){
  const loading = document.getElementById('state-loading');
  const success = document.getElementById('state-success');
  if (!loading || !success) return;

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DELAY = reduce ? 600 : 2000;

  setTimeout(() => {
    if (reduce){
      loading.hidden = true;
      success.hidden = false;
      return;
    }
    loading.style.opacity = '0';
    setTimeout(() => {
      loading.hidden = true;
      success.hidden = false;
      success.style.opacity = '0';
      requestAnimationFrame(() => { success.style.opacity = '1'; });
    }, 220);
  }, DELAY);
})();
</script>
