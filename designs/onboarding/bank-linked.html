<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank linked — Surmount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}

/* ═══ Surmount Design System — tokens (mirror Figma variable names) ═══ */
:root{
  /* Colors / Background */
  --color-bg-primary:#ffffff;
  --color-bg-primary-hover:#fafafa;

  /* Colors / Foreground */
  --color-fg-primary-900:#181d27;
  --color-fg-secondary-700:#414651;
  --color-fg-secondary-hover:#252b37;
  --color-fg-tertiary-600:#535862;
  --color-fg-quaternary-400:#a4a7ae;

  /* Colors / Text */
  --color-text-primary-900:#181d27;
  --color-text-tertiary-600:#535862;
  --color-text-white:#ffffff;

  /* Colors / Border */
  --color-border-primary:#00000017;

  /* Colors / Utility */
  --color-utility-gray-50:#fafafa;
  --color-utility-success-500:#17b26a;
  --color-utility-error-700:#b42318;

  /* Spacing */
  --spacing-xxs:2px; --spacing-xs:4px; --spacing-sm:6px;
  --spacing-md:8px;  --spacing-lg:12px; --spacing-xl:16px;
  --spacing-2xl:20px; --spacing-3xl:24px; --spacing-4xl:32px;
  --spacing-5xl:40px; --spacing-7xl:64px;

  /* Radius */
  --radius-xs:4px; --radius-sm:6px;
  --radius-md:8px; --radius-lg:10px;
  --radius-xl:12px; --radius-2xl:16px; --radius-3xl:20px;
  --radius-full:9999px;

  /* Typography */
  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-xs:12px;  --line-height-text-xs:18px;
  --font-size-text-sm:14px;  --line-height-text-sm:20px;
  --font-size-text-md:16px;  --line-height-text-md:24px;
  --font-size-text-lg:18px;  --line-height-text-lg:28px;
}

html,body{height:100%}
body{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);
  color:var(--color-fg-primary-900);
  background:var(--color-utility-gray-50);
  letter-spacing:-0.5px;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ─── Topbar ─── (matches link-bank.html) */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--spacing-xl) var(--spacing-3xl);
  background:var(--color-utility-gray-50);
}
.topbar-back,.topbar-close{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-fg-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
  transition:background 150ms ease,color 150ms ease;
}
.topbar-back:hover,.topbar-close:hover{background:var(--color-bg-primary-hover);color:var(--color-fg-secondary-hover)}
.topbar-back:active,.topbar-close:active{transform:scale(0.97)}
.topbar-back svg,.topbar-close svg{width:20px;height:20px;flex-shrink:0}
.topbar-brand{
  display:flex;align-items:center;gap:var(--spacing-md);
  color:var(--color-fg-primary-900);
}
.topbar-brand svg{width:28px;height:28px;display:block}
.topbar-brand-name{
  font-family:var(--font-family-display);
  font-size:20px;font-weight:500;letter-spacing:-0.4px;
}

/* ─── Main ─── */
main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:var(--spacing-5xl) var(--spacing-3xl);
}
.success{
  display:flex;flex-direction:column;align-items:center;
  gap:var(--spacing-4xl);
  width:100%;max-width:520px;
}

.heading{
  display:flex;flex-direction:column;gap:var(--spacing-md);
  width:100%;text-align:center;
}
.title{
  font-family:var(--font-family-body);
  font-size:40px;font-weight:500;
  line-height:1.05;letter-spacing:-0.8px;
  color:var(--color-fg-primary-900);
}
.subtitle{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:400;
  line-height:var(--line-height-text-md);
  color:var(--color-fg-tertiary-600);
}

/* ─── Connected account card — Surmount card treatment ─────────────────── *
 * 6%-alpha border + soft 12px-blur 3% shadow (lifted surface — same family
 * as the welcome / link-bank feature cards). NOT the input-field treatment. */
.account-card-wrap{
  display:flex;flex-direction:column;gap:var(--spacing-md);
  width:100%;
}
.account-card{
  position:relative;
  display:flex;align-items:center;gap:var(--spacing-lg);
  width:100%;
  padding:var(--spacing-lg) var(--spacing-2xl);
  background:var(--color-bg-primary);
  border:1px solid rgba(10,13,18,0.06);
  border-radius:var(--radius-2xl);
  box-shadow:0 2px 12px rgba(10,13,18,0.03);
}
/* Bank brand mark — actual Chase octagon, sitting on a soft Chase-tinted
 * disc so the brand reads cleanly at small sizes. */
.account-avatar{
  width:36px;height:36px;
  border-radius:var(--radius-full);
  background:rgba(17,122,202,0.10);
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
  overflow:hidden;
}
.account-avatar img{
  width:20px;height:20px;
  display:block;
}
.account-meta{
  display:flex;flex-direction:column;gap:var(--spacing-xxs);
  flex:1;min-width:0;
}
.account-title-row{
  display:flex;align-items:center;gap:var(--spacing-md);
}
.account-name{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;letter-spacing:-0.2px;
  color:var(--color-fg-primary-900);
}
/* Breathing halo on the connected-account status dot. Same dual-shadow
 * pattern as application-submitted's status pill, tinted to success-500.
 * Rest: 6px blur / 3px spread / 12% alpha. Peak: 10px / 6px / 20%. */
.account-dot{
  width:8px;height:8px;border-radius:var(--radius-full);
  background:var(--color-utility-success-500);
  flex-shrink:0;
  box-shadow:0 0 0 1px rgba(23,178,106,0.18),
             0 0 6px 3px rgba(23,178,106,0.12);
  animation:account-dot-halo 2400ms ease-in-out infinite;
}
@keyframes account-dot-halo{
  0%, 100% {
    box-shadow:0 0 0 1px rgba(23,178,106,0.18),
               0 0 6px 3px rgba(23,178,106,0.12);
  }
  50% {
    box-shadow:0 0 0 2px rgba(23,178,106,0.18),
               0 0 10px 6px rgba(23,178,106,0.20);
  }
}
.account-detail{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-sm);font-weight:400;letter-spacing:-0.1px;
  color:var(--color-fg-tertiary-600);
}
.account-menu{
  width:32px;height:32px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--radius-md);
  color:var(--color-fg-secondary-700);
  transition:background 150ms ease,color 150ms ease;
  flex-shrink:0;
}
.account-menu:hover{background:var(--color-bg-primary-hover);color:var(--color-fg-primary-900)}
.account-menu svg{width:18px;height:18px}

/* Dropdown anchored to the menu trigger */
.account-dropdown{
  position:absolute;top:calc(100% - 4px);right:var(--spacing-md);
  min-width:200px;
  padding:var(--spacing-xs);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-xl);
  box-shadow:0 12px 32px -4px rgba(10,13,18,0.14),0 4px 8px -2px rgba(10,13,18,0.06);
  display:flex;flex-direction:column;gap:var(--spacing-xxs);
  z-index:10;
  animation:dropdown-in 140ms cubic-bezier(.22,.61,.36,1);
  transform-origin:top right;
}
.account-dropdown[hidden]{display:none}
.dropdown-item{
  display:flex;align-items:center;gap:var(--spacing-md);
  width:100%;
  padding:var(--spacing-md) var(--spacing-lg);
  background:transparent;
  border-radius:var(--radius-md);
  color:var(--color-fg-primary-900);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-sm);font-weight:400;letter-spacing:-0.1px;
  text-align:left;
  transition:background 120ms ease;
}
.dropdown-item:hover{background:var(--color-bg-primary-hover)}
.dropdown-item.danger{color:var(--color-utility-error-700)}
.dropdown-item svg{width:16px;height:16px;flex-shrink:0;color:currentColor}

/* Footnote under the card */
.fine{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-sm);font-weight:400;letter-spacing:-0.1px;
  line-height:var(--line-height-text-sm);
  color:var(--color-fg-tertiary-600);
  text-align:center;
  width:100%;
}

/* ─── Primary CTA ─── (matches link-bank.html) */
.cta{
  display:inline-flex;align-items:center;justify-content:center;
  gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-fg-primary-900);
  color:var(--color-text-white);
  border:2px solid rgba(255,255,255,0.12);
  border-radius:var(--radius-md);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:-0.2px;
  transition:background 150ms ease,transform 120ms ease;
}
.cta:hover{background:var(--color-fg-secondary-hover)}
.cta:active{transform:scale(0.99)}

@keyframes dropdown-in{
  from{opacity:0;transform:translateY(-4px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@media (max-width:640px){
  main{padding:var(--spacing-4xl) var(--spacing-3xl);}
  .title{font-size:32px;letter-spacing:-0.6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="topbar-back" type="button" onclick="history.length>1?history.back():location.href='./link-bank.html'">
    <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="256" height="256" fill="none"/><line x1="216" y1="128" x2="40" y2="128" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><polyline points="112 56 40 128 112 200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>

    <span class="topbar-brand-name">Surmount</span>
  </div>
  <button class="topbar-close" onclick="history.length>1?history.back():location.href='../home/homepage.html'">
    <span>Close</span>
    <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="256" height="256" fill="none"/><line x1="200" y1="56" x2="56" y2="200" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="200" y1="200" x2="56" y2="56" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>

</header>

<main>
  <div class="success">
    <div class="heading">
      <h1 class="title">Nice work, Shawn</h1>
      <p class="subtitle">You've successfully linked Chase. Connected securely through Plaid — you'll be ready to fund your account the moment your application is approved.</p>
    </div>

    <div class="account-card-wrap">
      <div class="account-card">
        <div class="account-avatar">
          <img src="../assets/brand-logos/banks/chase-mark.svg" alt="Chase">
        </div>
        <div class="account-meta">
          <div class="account-title-row">
            <span class="account-name">Chase</span>
            <span class="account-dot" role="img" aria-label="Connected"></span>
          </div>
          <span class="account-detail">Checking · ••1234</span>
        </div>
        <button class="account-menu" type="button" id="account-menu-trigger" aria-haspopup="menu" aria-expanded="false" aria-label="Account options">
          <!-- Phosphor / DotsThreeVertical (regular) -->
          <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="256" height="256" fill="none"/><circle cx="128" cy="128" r="12" fill="currentColor"/><circle cx="128" cy="60" r="12" fill="currentColor"/><circle cx="128" cy="196" r="12" fill="currentColor"/></svg>
        </button>
        <div class="account-dropdown" id="account-dropdown" role="menu" hidden>
          <button class="dropdown-item" type="button" role="menuitem" data-action="update">
            <!-- Phosphor / PencilSimple (regular) -->
            <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="256" height="256" fill="none"/><path d="M92.69,216H48a8,8,0,0,1-8-8V163.31a8,8,0,0,1,2.34-5.65L165.66,34.34a8,8,0,0,1,11.31,0L221.66,79a8,8,0,0,1,0,11.31L98.34,213.66A8,8,0,0,1,92.69,216Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="136" y1="64" x2="192" y2="120" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>
            <span>Update connection</span>
          </button>
          <button class="dropdown-item danger" type="button" role="menuitem" data-action="disconnect">
            <!-- Phosphor / LinkBreak (regular) -->
            <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="256" height="256" fill="none"/><path d="M192,120l12.28-11.72a40,40,0,0,0-56.56-56.56L136,64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><path d="M64,136,51.72,147.72a40,40,0,0,0,56.56,56.56L120,192" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="192" y1="160" x2="216" y2="160" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="40" y1="96" x2="64" y2="96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="160" y1="192" x2="160" y2="216" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/><line x1="96" y1="40" x2="96" y2="64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/></svg>
            <span>Disconnect bank</span>
          </button>
        </div>
      </div>
      <p class="fine">You can have one bank linked at a time. Updating will replace your current connection.</p>
    </div>

    <button class="cta" type="button" onclick="location.href='../home/homepage.html'">
      Done
    </button>
  </div>
</main>

<script>
(function(){
  const trigger = document.getElementById('account-menu-trigger');
  const dropdown = document.getElementById('account-dropdown');
  if (!trigger || !dropdown) return;

  const close = () => { dropdown.hidden = true; trigger.setAttribute('aria-expanded','false'); };
  const open  = () => { dropdown.hidden = false; trigger.setAttribute('aria-expanded','true'); };

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    dropdown.hidden ? open() : close();
  });
  document.addEventListener('click', e => {
    if (!dropdown.hidden && !dropdown.contains(e.target) && !trigger.contains(e.target)) close();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !dropdown.hidden){ close(); trigger.focus(); }
  });

  // Demo handlers — wire to real flows later
  dropdown.addEventListener('click', e => {
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (!action) return;
    close();
    if (action === 'update'){
      // Re-enter the link-bank flow to swap credentials
      location.href = './link-bank.html';
    } else if (action === 'disconnect'){
      // Demo only — just bounce back to the pre-link state
      location.href = './link-bank.html';
    }
  });
})();
</script>
