<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invest in this asset — Surmount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none}

:root{
  --color-bg-primary:#ffffff;
  --color-bg-secondary:#fafafa;
  --color-fg-primary-900:#181d27;
  --color-fg-tertiary-600:#535862;
  --color-border-primary:rgba(0,0,0,0.086);
  --color-border-secondary:rgba(0,0,0,0.06);
  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-sm:14px;
  --font-size-display-xs:24px;
  --radius-xl:12px;
  --radius-2xl:16px;
  --spacing-lg:12px;
  --spacing-xl:16px;
  --spacing-2xl:20px;
  --spacing-3xl:24px;
  --spacing-4xl:32px;
}

html,body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#f0f2f5;
  font-family:var(--font-family-body);
  -webkit-font-smoothing:antialiased;
}

.card{
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-2xl);
  box-shadow:0 2px 12px rgba(10,13,18,0.06),0 0 0 0.5px rgba(0,0,0,0.04);
  padding:var(--spacing-3xl);
  width:420px;
  display:flex;flex-direction:column;gap:var(--spacing-2xl);
}

.card-copy{display:flex;flex-direction:column;gap:var(--spacing-lg)}

.card-title{
  font-family:var(--font-family-display);
  font-size:var(--font-size-display-xs);
  font-weight:500;
  letter-spacing:-0.5px;
  color:var(--color-fg-primary-900);
  line-height:1.25;
}

.card-sub{
  font-size:var(--font-size-text-sm);
  font-weight:400;
  color:var(--color-fg-tertiary-600);
  line-height:1.6;
  letter-spacing:-0.1px;
}

.actions{display:flex;flex-direction:column;gap:var(--spacing-lg)}

.btn{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;
  padding:var(--spacing-xl) var(--spacing-2xl);
  border-radius:var(--radius-xl);
  font-size:var(--font-size-text-sm);
  font-weight:500;
  letter-spacing:-0.2px;
  cursor:pointer;
  transition:opacity 0.15s ease,transform 0.1s ease;
}
.btn:active{transform:scale(0.99)}
.btn svg{width:16px;height:16px;flex-shrink:0}

.btn-primary{
  background:var(--color-fg-primary-900);
  color:#ffffff;
  border:1px solid transparent;
}
.btn-primary:hover{background:#252b37}

.btn-secondary{
  background:var(--color-bg-primary);
  color:var(--color-fg-primary-900);
  border:1px solid var(--color-border-primary);
}
.btn-secondary:hover{background:var(--color-bg-secondary)}
</style>
</head>
<body>

<div class="card">
  <div class="card-copy">
    <h2 class="card-title">Invest in this asset</h2>
    <p class="card-sub">Own the underlying stocks, or customize the holdings to fit your strategy.</p>
  </div>

  <div class="actions">
    <button class="btn btn-primary">
      Invest directly
      <svg viewBox="0 0 256 256" fill="currentColor">
        <path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/>
      </svg>
    </button>
    <button class="btn btn-secondary">
      Customize
      <svg viewBox="0 0 256 256" fill="currentColor">
        <path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/>
      </svg>
    </button>
  </div>
</div>

</body>
</html>
