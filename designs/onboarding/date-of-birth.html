<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}

/* ═══ Surmount Design System — tokens (mirror Figma variable names) ═══ */
:root{
  --color-bg-primary:#ffffff;
  --color-bg-primary-hover:#fafafa;

  --color-fg-primary-900:#181d27;
  --color-fg-secondary-700:#414651;
  --color-fg-secondary-hover:#252b37;
  --color-fg-tertiary-600:#535862;
  --color-fg-quaternary-400:#a4a7ae;
  --color-fg-disabled:#a4a7ae;
  --color-fg-disabled-subtle:#d5d7da;

  --color-text-primary-900:#181d27;
  --color-text-secondary-700:rgba(10,13,18,0.7);
  --color-text-secondary-hover:rgba(10,13,18,0.8);
  --color-text-tertiary-600:#535861;
  --color-text-placeholder:rgba(10,13,18,0.4);
  --color-text-white:#ffffff;

  --color-border-primary:#00000017;

  --color-utility-gray-50:#fafafa;

  --spacing-xxs:2px; --spacing-xs:4px; --spacing-sm:6px;
  --spacing-md:8px;  --spacing-lg:12px; --spacing-xl:16px;
  --spacing-2xl:20px; --spacing-3xl:24px; --spacing-4xl:32px;
  --spacing-5xl:40px; --spacing-6xl:48px; --spacing-7xl:64px;

  --radius-md:8px; --radius-xl:12px; --radius-full:9999px;

  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-sm:14px;  --line-height-text-sm:20px;
  --font-size-text-md:16px;  --line-height-text-md:24px;
  --font-size-text-lg:18px;  --line-height-text-lg:28px;
  --font-size-display-xs:24px; --line-height-display-xs:32px;
  --font-size-display-sm:30px; --line-height-display-sm:38px;
}

html,body{height:100%}
body{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);
  color:var(--color-fg-primary-900);
  background:var(--color-utility-gray-50);
  letter-spacing:-0.5px;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--spacing-xl) var(--spacing-3xl);
  background:var(--color-utility-gray-50);
}
.topbar-back,.topbar-close{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
  transition:background 150ms ease,color 150ms ease;
}
.topbar-back:hover,.topbar-close:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.topbar-back:active,.topbar-close:active{transform:scale(0.97)}
.topbar-back svg,.topbar-close svg{width:20px;height:20px;flex-shrink:0}
.topbar-brand{
  display:flex;align-items:center;gap:var(--spacing-md);
  color:var(--color-fg-primary-900);
}
.topbar-brand svg{width:28px;height:28px;display:block}
.topbar-brand-name{
  font-family:var(--font-family-display);
  font-size:20px;font-weight:500;letter-spacing:-0.4px;
}

main{
  flex:1;display:grid;place-items:center;
  padding:var(--spacing-3xl);
  min-height:0;
}
.stack{
  display:flex;flex-direction:column;align-items:center;
  gap:var(--spacing-5xl);
  width:100%;max-width:520px;
}

.hero{
  display:flex;flex-direction:column;align-items:center;gap:var(--spacing-md);
  text-align:center;width:100%;
}
.title{
  font-family:var(--font-family-body);
  font-size:var(--font-size-display-sm);font-weight:500;
  line-height:var(--line-height-display-sm);letter-spacing:-0.8px;
  color:var(--color-fg-primary-900);
}
.subtitle{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:400;
  line-height:var(--line-height-text-md);letter-spacing:-0.3px;
  color:var(--color-fg-tertiary-600);
  max-width:440px;
}

/* Stack of fields (name-row + name-row + DOB) */
.fields{
  display:flex;flex-direction:column;gap:var(--spacing-lg);width:100%;
}
.name-row{
  display:flex;gap:var(--spacing-lg);width:100%;
}
.name-row .field{flex:1;min-width:0}

.field{
  display:flex;flex-direction:column;
  width:100%;
  /* no gap — explicit margin on label/error so error's collapse leaves
   * no residual whitespace below the shell. */
}
.field-label{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-sm);font-weight:500;
  line-height:var(--line-height-text-sm);letter-spacing:0;
  color:var(--color-fg-tertiary-600);
  padding-left:var(--spacing-xxs);
  margin-bottom:var(--spacing-sm);
}
.field-shell{
  display:flex;align-items:center;gap:var(--spacing-md);
  padding:14px var(--spacing-xl);min-height:52px;
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-xl);
  cursor:text;
  transition:background 150ms ease,border-color 150ms ease,box-shadow 150ms ease;
}
.field-shell:focus-within{
  border-color:rgba(10,13,18,0.24);
  box-shadow:0 0 0 3px rgba(10,13,18,0.08);
}
.field-shell input{
  flex:1;min-width:0;
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
  color:var(--color-fg-primary-900);
  padding:0;
}
.field-shell input::placeholder{color:var(--color-text-placeholder);font-weight:400}
.field-trailing{
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--color-fg-tertiary-600);flex-shrink:0;
}
.field-trailing svg{width:20px;height:20px}

.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-fg-primary-900);
  color:var(--color-text-white);
  border:2px solid rgba(255,255,255,0.12);
  border-radius:var(--radius-md);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:-0.2px;
  transition:background 150ms ease,transform 120ms ease;
  min-width:160px;
}
.cta:hover{background:var(--color-fg-secondary-hover)}
.cta:active{transform:scale(0.99)}
.cta svg{width:20px;height:20px}
.cta[disabled]{
  background:var(--color-fg-disabled-subtle);
  color:var(--color-fg-disabled);
  border-color:rgba(255,255,255,0.12);
  cursor:not-allowed;
  pointer-events:none;
}

.modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--spacing-xl)}
.modal-root[hidden]{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,13,18,0.55);animation:modalFade 180ms ease-out}
.modal-card{position:relative;background:var(--color-bg-primary);border-radius:20px;box-shadow:0 24px 48px -8px rgba(10,13,18,0.22);width:100%;max-width:420px;padding:var(--spacing-4xl);display:flex;flex-direction:column;gap:var(--spacing-3xl);animation:modalIn 220ms cubic-bezier(.22,.61,.36,1)}
.modal-dismiss{position:absolute;top:var(--spacing-xl);right:var(--spacing-xl);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--color-fg-tertiary-600);transition:background 150ms ease,color 150ms ease}
.modal-dismiss:hover{background:var(--color-bg-primary-hover);color:var(--color-fg-primary-900)}
.modal-dismiss svg{width:18px;height:18px}
.modal-body{display:flex;flex-direction:column;gap:var(--spacing-md);padding-right:var(--spacing-4xl)}
.modal-title{font-family:var(--font-family-body);font-size:20px;font-weight:500;line-height:30px;letter-spacing:-0.4px;color:var(--color-fg-primary-900)}
.modal-desc{font-family:var(--font-family-body);font-size:var(--font-size-text-sm);font-weight:400;line-height:var(--line-height-text-sm);letter-spacing:0;color:var(--color-fg-tertiary-600)}
.modal-actions{display:flex;flex-direction:column;gap:var(--spacing-md)}
.btn-primary-full{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);padding:10px var(--spacing-xl);width:100%;background:var(--color-fg-primary-900);color:var(--color-text-white);border:2px solid rgba(255,255,255,0.12);border-radius:var(--radius-md);font-family:var(--font-family-body);font-size:var(--font-size-text-md);font-weight:500;line-height:var(--line-height-text-md);letter-spacing:0;transition:background 150ms ease,transform 120ms ease}
.btn-primary-full:hover{background:var(--color-fg-secondary-hover)}
.btn-primary-full:active{transform:scale(0.99)}
.btn-secondary-full{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);padding:10px var(--spacing-xl);width:100%;background:var(--color-bg-primary);color:var(--color-text-secondary-700);border:1px solid var(--color-border-primary);border-radius:var(--radius-md);font-family:var(--font-family-body);font-size:var(--font-size-text-md);font-weight:500;line-height:var(--line-height-text-md);letter-spacing:0;transition:background 150ms ease,color 150ms ease,transform 120ms ease}
.btn-secondary-full:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.btn-secondary-full:active{transform:scale(0.99)}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important}
  .modal-backdrop,.modal-card{animation:none !important}
}

/* ─── Date picker popover ─────────────────────────────────────────────── */
.field-with-picker{position:relative;width:100%}
.dp-pop{
  position:absolute;top:calc(100% + var(--spacing-md));left:0;
  z-index:10;
  width:296px;
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-xl);
  box-shadow:0 12px 28px -4px rgba(10,13,18,0.12),0 4px 6px -2px rgba(10,13,18,0.06);
  padding:var(--spacing-lg);
  opacity:0;transform:translateY(-4px);
  pointer-events:none;
  transition:opacity 160ms ease,transform 160ms ease;
}
.dp-pop[data-open="true"]{
  opacity:1;transform:translateY(0);pointer-events:auto;
}
.dp-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 0 var(--spacing-md);
}
.dp-nav{
  width:28px;height:28px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--radius-md);
  color:var(--color-fg-secondary-700);
  background:transparent;border:none;cursor:pointer;
  transition:background 150ms ease,color 150ms ease;
}
.dp-nav:hover{background:var(--color-bg-primary-hover);color:var(--color-fg-primary-900)}
.dp-nav svg{width:14px;height:14px}
.dp-title{
  display:inline-flex;align-items:center;gap:var(--spacing-sm);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-sm);font-weight:500;
  color:var(--color-fg-primary-900);letter-spacing:-0.2px;
}
.dp-month-btn{
  display:inline-flex;align-items:center;gap:var(--spacing-xxs);
  padding:var(--spacing-xxs) var(--spacing-sm);
  border-radius:var(--radius-md);
  background:transparent;border:none;
  font:inherit;color:inherit;cursor:pointer;
  transition:background 150ms ease;
}
.dp-month-btn:hover{background:var(--color-bg-primary-hover)}
.dp-month-btn svg{width:12px;height:12px;color:var(--color-fg-tertiary-600)}
.dp-dow{
  display:grid;grid-template-columns:repeat(7,1fr);gap:2px;
  padding:0 0 var(--spacing-xs);
}
.dp-dow span{
  text-align:center;
  font-family:var(--font-family-body);
  font-size:11px;font-weight:500;letter-spacing:0;
  color:var(--color-fg-tertiary-600);
  padding:var(--spacing-xxs) 0;
}
.dp-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:2px;
}
.dp-cell{
  aspect-ratio:1;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--radius-md);
  background:transparent;border:none;
  font-family:var(--font-family-body);
  font-size:13px;font-weight:400;letter-spacing:0;
  color:var(--color-fg-primary-900);cursor:pointer;
  transition:background 150ms ease,color 150ms ease;
}
.dp-cell:hover{background:var(--color-bg-primary-hover)}
.dp-cell.is-other{color:var(--color-fg-quaternary-400)}
.dp-cell.is-selected,.dp-cell.is-selected:hover{
  background:var(--color-fg-primary-900);
  color:var(--color-text-white);
  font-weight:500;
}

/* ─── Field error state (Carbon-style invalid date feedback) ──────────── */
.field-shell.is-error{
  border-color:#98443d;
}
.field-shell.is-error:focus-within{
  border-color:#98443d;
  box-shadow:0 0 0 3px rgba(152,68,61,0.14);
}
/* Error stays in the layout always so the field can animate its overall
 * height when the message appears/disappears. Only the container grows —
 * the message text/icon don't fade or slide; they're simply clipped by
 * overflow:hidden while the row is collapsed. */
.field-error{
  display:inline-flex;
  align-items:center;gap:var(--spacing-xs);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-sm);
  font-weight:400;letter-spacing:-0.2px;
  color:#98443d;
  padding-left:var(--spacing-xxs);
  max-height:0;
  margin-top:0;
  overflow:hidden;
  pointer-events:none;
  transition:max-height 260ms cubic-bezier(0.16, 1, 0.3, 1),
             margin-top 260ms cubic-bezier(0.16, 1, 0.3, 1);
}
.field-error.is-visible{
  max-height:32px;
  margin-top:var(--spacing-sm);
  pointer-events:auto;
}
.field-error svg{width:16px;height:16px;flex-shrink:0}

@media (prefers-reduced-motion:reduce){
  .dp-pop{transition:none}
}
</style>
</head>

    </div>
    <div class="modal-actions">
      <button class="btn-primary-full" type="button" onclick="location.href='../home/homepage.html'">Exit account opening</button>
      <button class="btn-secondary-full" type="button" data-modal-dismiss>Continue opening</button>
    </div>
  </div>
</div>

<!-- EXIT MODAL SCRIPT (before HTML body so modal elements exist) -->
<script>
(function(){
  const modal = document.getElementById('exit-modal');
  const closeBtn = document.querySelector('.topbar-close');
  if (!modal || !closeBtn) return;
  const open = () => { modal.hidden = false; document.body.style.overflow = 'hidden'; };
  const dismiss = () => { modal.hidden = true; document.body.style.overflow = ''; };
  closeBtn.addEventListener('click', e => { e.preventDefault(); open(); });
  modal.addEventListener('click', e => { if (e.target.closest('[data-modal-dismiss]')) dismiss(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) dismiss(); });
})();

</script>

<script>
// Date-of-birth picker — must run after DOM is ready.
(function(){
  const input    = document.getElementById('dob-input');
  const trig     = document.getElementById('dp-trigger');
  const pop      = document.getElementById('dp-pop');
  const grid     = document.getElementById('dp-grid');
  const prev     = document.getElementById('dp-prev');
  const nextNav  = document.getElementById('dp-next');
  const mLabel   = document.getElementById('dp-month-label');
  const yLabel   = document.getElementById('dp-year-label');
  const errEl    = document.getElementById('dob-error');
  const errText  = document.getElementById('dob-error-text');
  const nextBtn  = document.getElementById('dob-next');
  if (!input || !pop) return;

  function parse(str){
    const m = String(str).replace(/\s+/g,'').match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
    if (!m) return null;
    const mm = +m[1], dd = +m[2], yy = +m[3];
    if (mm<1||mm>12||dd<1||dd>31||yy<1900||yy>2100) return null;
    const dt = new Date(yy, mm-1, dd);
    if (dt.getFullYear()!==yy || dt.getMonth()!==mm-1 || dt.getDate()!==dd) return null;
    return { y: yy, m: mm-1, d: dd };
  }
  function format(s){
    return String(s.m+1).padStart(2,'0') + ' / ' + String(s.d).padStart(2,'0') + ' / ' + s.y;
  }
  function validate(str){
    if (!str) return null;
    const digits = str.replace(/\D/g,'');
    if (digits.length < 8) return null;
    const p = parse(str);
    if (!p) return 'Invalid date. Please check the month and day.';
    const dt = new Date(p.y, p.m, p.d);
    const today = new Date(); today.setHours(0,0,0,0);
    if (dt > today) return 'Date of birth cannot be in the future.';
    if (p.y < 1900) return 'Please enter a year between 1900 and today.';
    return null;
  }
  function setError(msg){
    if (msg){
      errText.textContent = msg;
      errEl.classList.add('is-visible');
      trig.classList.add('is-error');
      input.setAttribute('aria-invalid','true');
    } else {
      errText.textContent = '';
      errEl.classList.remove('is-visible');
      trig.classList.remove('is-error');
      input.removeAttribute('aria-invalid');
    }
  }
  function refreshNext(){
    const ok = !validate(input.value) && !!parse(input.value);
    if (ok) nextBtn.removeAttribute('disabled');
    else nextBtn.setAttribute('disabled','');
  }

  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const today = new Date();
  let viewY = today.getFullYear() - 25;
  let viewM = today.getMonth();
  let sel = null;

  function openPop(){ pop.setAttribute('data-open','true'); render(); }
  function closePop(){ pop.setAttribute('data-open','false'); }

  function render(){
    mLabel.textContent = MONTHS[viewM];
    yLabel.textContent = viewY;
    const firstDow = new Date(viewY, viewM, 1).getDay();
    const dim = new Date(viewY, viewM+1, 0).getDate();
    const dimPrev = new Date(viewY, viewM, 0).getDate();
    grid.innerHTML = '';
    for (let i = 0; i < 42; i++){
      let y, m, d, other = false;
      if (i < firstDow){
        d = dimPrev - firstDow + 1 + i; m = viewM===0?11:viewM-1; y = viewM===0?viewY-1:viewY; other=true;
      } else if (i >= firstDow + dim){
        d = i - firstDow - dim + 1; m = viewM===11?0:viewM+1; y = viewM===11?viewY+1:viewY; other=true;
      } else {
        d = i - firstDow + 1; m = viewM; y = viewY;
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dp-cell' + (other ? ' is-other' : '');
      if (sel && sel.y===y && sel.m===m && sel.d===d) btn.classList.add('is-selected');
      btn.textContent = d;
      btn.addEventListener('click', () => {
        sel = { y, m, d }; viewY = y; viewM = m;
        input.value = format(sel);
        setError(validate(input.value));
        refreshNext();
        closePop();
      });
      grid.appendChild(btn);
    }
  }

  trig.addEventListener('mousedown', () => {
    if (!pop.matches('[data-open="true"]')) openPop();
  });
  input.addEventListener('focus', openPop);

  function maskFromDigits(d){
    let out = d.slice(0,2);
    if (d.length > 2) out += ' / ' + d.slice(2,4);
    if (d.length > 4) out += ' / ' + d.slice(4,8);
    return out;
  }
  input.addEventListener('input', () => {
    const digits = input.value.replace(/\D/g,'').slice(0,8);
    const masked = maskFromDigits(digits);
    if (input.value !== masked){
      input.value = masked;
      try { input.setSelectionRange(masked.length, masked.length); } catch(_) {}
    }
    const p = parse(input.value);
    if (p){ sel = p; viewY = p.y; viewM = p.m; render(); }
    setError(validate(input.value));
    refreshNext();
  });
  input.addEventListener('blur', () => { setError(validate(input.value)); refreshNext(); });

  prev.addEventListener('click', e => {
    e.stopPropagation();
    if (viewM===0){ viewM=11; viewY--; } else viewM--;
    render();
  });
  nextNav.addEventListener('click', e => {
    e.stopPropagation();
    if (viewM===11){ viewM=0; viewY++; } else viewM++;
    render();
  });

  document.addEventListener('mousedown', e => {
    if (!pop.contains(e.target) && !trig.contains(e.target)) closePop();
  });
  document.addEventListener('keydown', e => {
    if (e.key==='Escape' && pop.matches('[data-open="true"]')){ closePop(); input.blur(); }
  });
})();
</script>
