<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash account — Surmount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}

/* ═══ Surmount Design System — tokens (mirror Figma variable names) ═══ */
:root{
  /* Colors / Background */
  --color-bg-primary:#ffffff;
  --color-bg-primary-hover:#fafafa;
  --color-bg-brand-solid:#406ad0;
  --color-bg-brand-solid-hover:#3757be;

  /* Colors / Foreground */
  --color-fg-primary-900:#181d27;
  --color-fg-secondary-700:#414651;
  --color-fg-secondary-hover:#252b37;
  --color-fg-tertiary-600:#535862;
  --color-fg-quaternary-400:#a4a7ae;
  --color-fg-disabled:#a4a7ae;
  --color-fg-disabled-subtle:#d5d7da;

  /* Colors / Text */
  --color-text-primary-900:#181d27;
  --color-text-secondary-700:rgba(10,13,18,0.7);
  --color-text-secondary-hover:rgba(10,13,18,0.8);
  --color-text-white:#ffffff;

  /* Colors / Border */
  --color-border-primary:#00000017;

  /* Component colors / Utility / Gray */
  --color-utility-gray-50:#fafafa;

  /* Spacing */
  --spacing-xxs:2px; --spacing-xs:4px; --spacing-sm:6px;
  --spacing-md:8px;  --spacing-lg:12px; --spacing-xl:16px;
  --spacing-2xl:20px; --spacing-3xl:24px; --spacing-4xl:32px;
  --spacing-5xl:40px; --spacing-7xl:64px;

  /* Radius */
  --radius-md:8px;

  /* Typography — font-family/font-size/line-height per Figma variable names */
  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-sm:14px;  --line-height-text-sm:20px;
  --font-size-text-md:16px;  --line-height-text-md:24px;
  --font-size-display-lg:48px;
}

html,body{height:100%}
body{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);
  color:var(--color-fg-primary-900);
  background:var(--color-utility-gray-50);
  letter-spacing:-0.5px;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ─── Topbar ──────────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--spacing-xl) var(--spacing-3xl);
  background:var(--color-utility-gray-50);
}
/* Hidden "Back" spacer — same dimensions as visible Back across flow
 * so the topbar layout is identical on every page (logo stays centered). */
.topbar-back{
  opacity:0;pointer-events:none;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
}
.topbar-back svg{width:20px;height:20px;flex-shrink:0}
.topbar-brand{
  display:flex;align-items:center;gap:var(--spacing-md);
  color:var(--color-fg-primary-900);
}
.topbar-brand svg{width:28px;height:28px;display:block}
.topbar-brand-name{
  font-family:var(--font-family-display);
  font-size:20px;font-weight:500;letter-spacing:-0.4px;
}
/* Buttons/Button — Size=lg, Hierarchy=Secondary (Surmount Design System) */
.topbar-close{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);             /* py-2-5, px-xl */
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
  transition:background 150ms ease,color 150ms ease;
}
.topbar-close:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.topbar-close:active{transform:scale(0.97)}
.topbar-close svg{width:20px;height:20px;flex-shrink:0}

/* ─── Main ────────────────────────────────────────────────────────────── */
main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:var(--spacing-7xl) 190px;
}
.split{
  display:flex;gap:var(--spacing-7xl);align-items:center;
}
.illo-img{
  width:300px;height:300px;object-fit:contain;
  flex-shrink:0;
}

.content{
  display:flex;flex-direction:column;align-items:flex-start;
  gap:var(--spacing-5xl);             /* 40px */
  width:380.883px;flex-shrink:0;
}
.heading{display:flex;flex-direction:column;gap:var(--spacing-md);width:100%}
.title{
  font-family:var(--font-family-body);
  font-size:40px;font-weight:500;
  line-height:1.05;letter-spacing:-0.8px;
  color:var(--color-fg-primary-900);
  white-space:nowrap;
}
.subtitle{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:400;
  line-height:var(--line-height-text-md);
  color:var(--color-fg-secondary-700);
}

.bullets{
  list-style:none;display:flex;flex-direction:column;gap:var(--spacing-lg);
}
.bullet{
  display:flex;align-items:center;gap:10px;
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:400;
  line-height:var(--line-height-text-md);
  color:var(--color-text-secondary-700);
}
.bullet-icon{width:20px;height:20px;flex-shrink:0}

/* ─── CTA (Buttons/Button — Hierarchy=Primary) ────────────────────────── */
.cta{
  display:inline-flex;align-items:center;justify-content:center;
  gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-fg-primary-900);        /* Primary is near-black neutral, not brand blue */
  color:var(--color-text-white);
  border:2px solid rgba(255,255,255,0.12);       /* skeuomorphic border (alpha-white-12) */
  border-radius:var(--radius-md);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:-0.2px;
  transition:background 150ms ease,transform 120ms ease;
}
.cta:hover{background:var(--color-fg-secondary-hover)}
.cta:active{transform:scale(0.99)}
.cta svg{width:20px;height:20px}

/* ─── Footer ──────────────────────────────────────────────────────────── */
.page-footer{
  height:67px;
  border-top:1px solid var(--color-border-primary);
  display:flex;align-items:center;justify-content:center;gap:var(--spacing-md);
  padding:25px var(--spacing-3xl) var(--spacing-3xl);
  background:var(--color-utility-gray-50);
}
.page-footer svg{width:16px;height:16px;color:var(--color-fg-tertiary-600)}
.page-footer a{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-sm);font-weight:400;
  color:var(--color-fg-tertiary-600);
  text-decoration:underline;text-underline-offset:2px;
  letter-spacing:-0.5px;
}
.page-footer a:hover{color:var(--color-fg-primary-900)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important}
}
</style>
</head>

    <span class="topbar-brand-name">Surmount</span>
