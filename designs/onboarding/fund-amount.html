<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fund your account — Surmount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<link rel="stylesheet" href="./transitions.css?v=44">
<script src="./transitions.js?v=44" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}

/* ═══ Surmount Design System — tokens ═══ */
:root{
  --color-bg-primary:#ffffff;
  --color-bg-primary-hover:#fafafa;
  --color-bg-secondary:#fafafa;
  --color-bg-tertiary:#f5f5f5;

  --color-fg-primary-900:#181d27;
  --color-fg-secondary-700:#414651;
  --color-fg-secondary-hover:#252b37;
  --color-fg-tertiary-600:#535862;
  --color-fg-quaternary-400:#a3a7ae;
  --color-fg-disabled:#a4a7ae;
  --color-fg-disabled-subtle:#d5d7da;
  --color-fg-white:#ffffff;

  --color-text-primary-900:#181d27;
  --color-text-secondary-700:rgba(10,13,18,0.7);
  --color-text-secondary-hover:rgba(10,13,18,0.8);
  --color-text-tertiary-600:#535861;
  --color-text-disabled:rgba(10,13,18,0.4);
  --color-text-white:#ffffff;

  --color-border-primary:#00000017;
  --color-border-secondary:#00000010;

  --color-utility-gray-50:#fafafa;

  --shadow-card:0 2px 12px rgba(10,13,18,0.03);

  --spacing-xxs:2px; --spacing-xs:4px; --spacing-sm:6px;
  --spacing-md:8px;  --spacing-lg:12px; --spacing-xl:16px;
  --spacing-2xl:20px; --spacing-3xl:24px; --spacing-4xl:32px;
  --spacing-5xl:40px; --spacing-6xl:48px; --spacing-7xl:64px;

  --radius-sm:6px; --radius-md:8px; --radius-lg:10px;
  --radius-xl:12px; --radius-2xl:16px; --radius-full:9999px;

  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-sm:14px;  --line-height-text-sm:20px;
  --font-size-text-md:16px;  --line-height-text-md:24px;
  --font-size-display-xs:24px; --line-height-display-xs:32px;
}

html,body{height:100%}
body{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);
  color:var(--color-fg-primary-900);
  background:var(--color-utility-gray-50);
  letter-spacing:-0.5px;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ─── Topbar (shared with rest of flow) ──────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--spacing-xl) var(--spacing-3xl);
  background:var(--color-utility-gray-50);
}
/* Topbar Back is now a hidden spacer — visible back button lives above
 * the title (.back-icon-btn). Spacer keeps the brand centered. */
.topbar-back{
  opacity:0;pointer-events:none;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
}
.topbar-back svg{width:20px;height:20px;flex-shrink:0}
.topbar-close{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
  transition:background 150ms ease,color 150ms ease;
}
.topbar-close:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.topbar-close:active{transform:scale(0.97)}
.topbar-close svg{width:20px;height:20px;flex-shrink:0}

/* ─── Inline icon-only back button (lives in content, above title) ──── */
.back-icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  align-self:flex-start;
  width:40px;height:40px;
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  transition:background 150ms ease,color 150ms ease,transform 120ms ease;
}
.back-icon-btn:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.back-icon-btn:active{transform:scale(0.97)}
.back-icon-btn svg{width:20px;height:20px}
.topbar-brand{
  display:flex;align-items:center;gap:var(--spacing-md);
  color:var(--color-fg-primary-900);
}
.topbar-brand svg{width:28px;height:28px;display:block}
.topbar-brand-name{
  font-family:var(--font-family-display);
  font-size:20px;font-weight:500;letter-spacing:-0.4px;
}

/* ─── Page layout ─────────────────────────────────────────────────────── */
main{
  flex:1;display:flex;align-items:flex-start;justify-content:center;
  padding:var(--spacing-5xl) var(--spacing-5xl);
  overflow-y:auto;
}
.fund-container{
  width:100%;max-width:480px;
  display:flex;flex-direction:column;gap:28px;
}

/* ─── Title ──────────────────────────────────────────────────────────── */
.fund-title{
  font-family:var(--font-family-display);
  font-size:var(--font-size-display-xs);font-weight:500;
  line-height:var(--line-height-display-xs);
  color:var(--color-fg-secondary-700);
  letter-spacing:-0.4px;
}
.fund-title-name{color:var(--color-fg-primary-900)}

/* ─── Card ───────────────────────────────────────────────────────────── */
.fund-card{
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-secondary);
  border-radius:var(--radius-xl);
  padding:21px;
  box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;gap:16px;
}

/* ─── Amount display ─────────────────────────────────────────────────── */
@keyframes amount-out{ from{opacity:1;transform:translateY(0)}   to{opacity:0;transform:translateY(-10px)} }
@keyframes amount-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)}     }

.amount-wrap{position:relative;overflow:hidden;height:74px}
.amount-display{
  font-family:var(--font-family-display);
  font-size:64px;font-weight:500;
  color:var(--color-text-disabled);
  line-height:72px;letter-spacing:-2px;
  background:transparent;border:none;outline:none;
  width:100%;cursor:text;
  caret-color:var(--color-fg-primary-900);
  padding:0;
}
.amount-display.has-value{color:var(--color-fg-primary-900)}
.amount-display.anim-out{animation:amount-out .12s cubic-bezier(0.4,0,1,1) forwards}
.amount-display.anim-in {animation:amount-in  .16s cubic-bezier(0.0,0,0.2,1) forwards}

/* ─── Quick chips ────────────────────────────────────────────────────── */
.amount-chips{display:flex;gap:var(--spacing-md);flex-wrap:wrap}
.amount-chip{
  height:32px;padding:0 var(--spacing-lg);
  background:var(--color-bg-tertiary);
  border:none;border-radius:var(--radius-lg);
  font-family:var(--font-family-display);font-size:13px;font-weight:500;
  color:var(--color-text-secondary-700);
  cursor:pointer;user-select:none;
  transition:background .1s,transform .08s;
  white-space:nowrap;
}
.amount-chip:hover{background:#ebebeb}
.amount-chip:active{background:#e0e0e0;transform:scale(0.95)}

/* ─── Repeat card ────────────────────────────────────────────────────── */
.repeat-top{display:flex;align-items:center;justify-content:space-between}
.repeat-left{display:flex;align-items:center;gap:10px}
.repeat-label{font-size:14px;font-weight:400;color:var(--color-fg-secondary-700);line-height:20px}

.toggle{
  width:44px;height:24px;
  background:var(--color-bg-tertiary);
  border-radius:var(--radius-full);padding:2px;
  cursor:pointer;position:relative;
  transition:background .22s;flex-shrink:0;border:none;
}
.toggle.on{background:var(--color-fg-primary-900)}
.toggle-knob{
  width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(10,13,18,0.1),0 1px 2px -1px rgba(10,13,18,0.1);
  position:absolute;top:2px;left:2px;
  transition:transform .2s cubic-bezier(0.4,0,0.2,1);
}
.toggle.on .toggle-knob{transform:translateX(20px)}

.freq-pill{
  display:flex;align-items:center;gap:var(--spacing-md);
  background:var(--color-bg-tertiary);
  border-radius:var(--radius-lg);padding:10px var(--spacing-xl);
  cursor:pointer;border:none;
  font-family:var(--font-family-body);font-size:14px;font-weight:500;
  color:var(--color-fg-secondary-700);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease, background .12s;
}
.freq-pill.visible{opacity:1;pointer-events:all}
.freq-pill:hover{background:#ebebeb}
.freq-pill svg{width:14px;height:14px;stroke:rgba(10,13,18,0.4);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.starts-row{
  display:flex;align-items:center;justify-content:flex-end;gap:var(--spacing-sm);
  overflow:hidden;
  max-height:0;margin-top:-16px;opacity:0;
  transition:max-height .28s cubic-bezier(0.16,1,0.3,1),
             margin-top  .28s cubic-bezier(0.16,1,0.3,1),
             opacity     .18s ease;
}
.starts-row.visible{max-height:32px;margin-top:0;opacity:1}
.starts-label{font-size:14px;font-weight:400;color:var(--color-fg-secondary-700);line-height:20px}
.starts-row svg{width:16px;height:16px;stroke:rgba(10,13,18,0.4);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;cursor:pointer}

/* ─── Frequency dropdown ─────────────────────────────────────────────── */
.freq-wrap{position:relative}
.freq-dropdown{
  position:absolute;top:calc(100% + 6px);right:0;
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-xl);
  padding:var(--spacing-xs);
  min-width:150px;
  box-shadow:0 8px 24px rgba(10,13,18,0.12);
  z-index:50;
  opacity:0;pointer-events:none;transform:translateY(-4px) scale(0.97);
  transform-origin:top right;
  transition:opacity .13s ease,transform .13s cubic-bezier(0.16,1,0.3,1);
}
.freq-dropdown.open{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.freq-option{
  display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-xl);
  padding:var(--spacing-md) var(--spacing-lg);
  border-radius:var(--radius-md);
  font-size:var(--font-size-text-sm);font-weight:400;
  line-height:var(--line-height-text-sm);
  color:var(--color-fg-primary-900);
  cursor:pointer;background:none;border:none;
  font-family:inherit;width:100%;text-align:left;
  transition:background .1s ease;
}
.freq-option:hover{background:rgba(0,0,0,0.04)}
.freq-option.selected{font-weight:500}
.freq-check{width:14px;height:14px;flex-shrink:0;color:var(--color-fg-primary-900);visibility:hidden}
.freq-option.selected .freq-check{visibility:visible}

/* ─── Starts date picker ─────────────────────────────────────────────── */
.date-picker-wrap{position:relative;display:inline-flex}
.starts-trigger{
  display:inline-flex;align-items:center;gap:var(--spacing-sm);
  background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
}
.starts-trigger .starts-label{
  font-size:14px;font-weight:400;color:var(--color-fg-secondary-700);line-height:20px;
  transition:color .1s;
}
.starts-trigger:hover .starts-label{color:var(--color-fg-primary-900)}
.starts-trigger svg{width:16px;height:16px;stroke:rgba(10,13,18,0.35);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.dp-popover{
  position:absolute;top:calc(100% + 6px);right:0;
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-xl);
  padding:var(--spacing-xl);
  width:296px;
  box-shadow:0 8px 32px rgba(10,13,18,0.14);
  z-index:200;
  opacity:0;pointer-events:none;transform:translateY(-4px) scale(0.97);
  transform-origin:top right;
  transition:opacity .15s ease,transform .15s cubic-bezier(0.16,1,0.3,1);
}
.dp-popover.open{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--spacing-lg)}
.dp-month-label{font-size:var(--font-size-text-sm);font-weight:500;line-height:var(--line-height-text-sm);color:var(--color-fg-primary-900)}
.dp-nav{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-md);color:var(--color-fg-tertiary-600);
  cursor:pointer;transition:background .1s;border:none;background:none;font-family:inherit;
}
.dp-nav:hover{background:rgba(0,0,0,0.06)}
.dp-nav svg{width:16px;height:16px}
.dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:var(--spacing-xs)}
.dp-weekday{text-align:center;font-size:11px;font-weight:500;color:var(--color-fg-quaternary-400);padding:var(--spacing-xs) 0}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-md);font-size:13px;font-weight:400;
  color:var(--color-fg-primary-900);cursor:pointer;
  transition:background .08s;border:none;background:none;
  font-family:var(--font-family-body);position:relative;
}
.dp-day:hover:not([disabled]):not(.dp-empty):not(.dp-selected){background:rgba(0,0,0,0.06)}
.dp-day.dp-today{font-weight:500}
.dp-day.dp-today:not(.dp-selected)::after{
  content:'';display:block;width:3px;height:3px;
  background:var(--color-fg-primary-900);border-radius:50%;
  position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
}
.dp-day.dp-selected{background:var(--color-fg-primary-900);color:#fff;font-weight:500}
.dp-day[disabled]{color:var(--color-fg-disabled);cursor:default}
.dp-day.dp-empty{pointer-events:none}

/* ─── Pay with ───────────────────────────────────────────────────────── */
.pay-with{display:flex;flex-direction:column;gap:10px}
.pay-with-label{font-size:14px;font-weight:500;color:var(--color-fg-quaternary-400);line-height:20px}
.pay-with-row{display:flex;align-items:center;justify-content:space-between}

.broker-select{
  display:inline-flex;align-items:center;gap:var(--spacing-md);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-secondary);
  border-radius:var(--radius-md);
  padding:var(--spacing-md) var(--spacing-lg);
  cursor:pointer;
  box-shadow:var(--shadow-card);
  transition:border-color .12s;
}
.broker-select:hover{border-color:rgba(0,0,0,0.12)}
.broker-avatar{
  width:24px;height:24px;border-radius:50%;
  overflow:hidden;flex-shrink:0;
  border:0.5px solid rgba(0,0,0,0.08);
}
.broker-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.broker-name{font-size:14px;font-weight:400;color:rgba(10,13,18,0.9);line-height:20px;white-space:nowrap}
.broker-chevron svg{width:16px;height:16px;stroke:rgba(10,13,18,0.4);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.available-text{
  font-size:14px;font-weight:400;color:var(--color-fg-quaternary-400);
  font-family:var(--font-family-display);white-space:nowrap;
}

/* ─── Broker dropdown ────────────────────────────────────────────────── */
.broker-select-wrap{position:relative}
.broker-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;z-index:50;
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-secondary);
  border-radius:var(--radius-xl);
  box-shadow:0 8px 24px rgba(10,13,18,0.10);
  min-width:220px;padding:6px;
  opacity:0;pointer-events:none;
  transform:translateY(-4px) scale(0.98);
  transform-origin:top left;
  transition:opacity .15s ease, transform .15s ease;
}
.broker-dropdown.open{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.broker-option{
  display:flex;align-items:center;gap:var(--spacing-md);
  padding:9px var(--spacing-md);
  border-radius:var(--radius-md);
  cursor:pointer;
  transition:background .1s ease;
}
.broker-option:hover{background:var(--color-bg-secondary)}
.broker-option.selected{background:var(--color-bg-secondary)}
.broker-option-avatar{
  width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;
  border:0.5px solid rgba(0,0,0,0.08);
}
.broker-option-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.broker-option-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.broker-option-name{font-size:14px;font-weight:400;color:rgba(10,13,18,0.9);line-height:20px}
.broker-option-balance{font-size:12px;font-weight:400;color:var(--color-fg-quaternary-400);line-height:16px}
.broker-option-check{width:16px;height:16px;flex-shrink:0;color:var(--color-fg-primary-900);opacity:0}
.broker-option.selected .broker-option-check{opacity:1}

/* ─── Review button ──────────────────────────────────────────────────── */
.review-btn{
  width:100%;padding:10px var(--spacing-xl);
  background:var(--color-bg-tertiary);
  border:1px solid #e9eaeb;
  border-radius:var(--radius-md);
  font-family:inherit;font-size:16px;font-weight:500;
  color:var(--color-fg-disabled);cursor:not-allowed;
  transition:background .15s,color .15s,border-color .15s;
  display:flex;align-items:center;justify-content:center;
}
.review-btn.enabled{
  background:var(--color-fg-primary-900);
  border-color:var(--color-fg-primary-900);
  color:var(--color-text-white);cursor:pointer;
}
.review-btn.enabled:hover{background:var(--color-fg-secondary-hover);border-color:var(--color-fg-secondary-hover)}

/* ─── Exit confirmation modal ────────────────────────────────────────── */
.modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--spacing-xl)}
.modal-root[hidden]{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,13,18,0.55);animation:modalFade 180ms ease-out}
.modal-card{position:relative;background:var(--color-bg-primary);border-radius:20px;box-shadow:0 24px 48px -8px rgba(10,13,18,0.22);width:100%;max-width:420px;padding:var(--spacing-4xl);display:flex;flex-direction:column;gap:var(--spacing-3xl);animation:modalIn 220ms cubic-bezier(.22,.61,.36,1)}
.modal-dismiss{position:absolute;top:var(--spacing-xl);right:var(--spacing-xl);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--color-fg-tertiary-600);transition:background 150ms ease,color 150ms ease}
.modal-dismiss:hover{background:var(--color-bg-primary-hover);color:var(--color-fg-primary-900)}
.modal-dismiss svg{width:18px;height:18px}
.modal-body{display:flex;flex-direction:column;gap:var(--spacing-md);padding-right:var(--spacing-4xl)}
.modal-title{font-family:var(--font-family-body);font-size:20px;font-weight:500;line-height:30px;letter-spacing:-0.4px;color:var(--color-fg-primary-900)}
.modal-desc{font-family:var(--font-family-body);font-size:var(--font-size-text-sm);font-weight:400;line-height:var(--line-height-text-sm);letter-spacing:0;color:var(--color-text-tertiary-600)}
.modal-actions{display:flex;flex-direction:column;gap:var(--spacing-md)}
.btn-primary-full{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);padding:10px var(--spacing-xl);width:100%;background:var(--color-fg-primary-900);color:var(--color-text-white);border:2px solid rgba(255,255,255,0.12);border-radius:var(--radius-md);font-family:var(--font-family-body);font-size:var(--font-size-text-md);font-weight:500;line-height:var(--line-height-text-md);letter-spacing:0;transition:background 150ms ease,transform 120ms ease}
.btn-primary-full:hover{background:var(--color-fg-secondary-hover)}
.btn-primary-full:active{transform:scale(0.99)}
.btn-secondary-full{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);padding:10px var(--spacing-xl);width:100%;background:var(--color-bg-primary);color:var(--color-text-secondary-700);border:1px solid var(--color-border-primary);border-radius:var(--radius-md);font-family:var(--font-family-body);font-size:var(--font-size-text-md);font-weight:500;line-height:var(--line-height-text-md);letter-spacing:0;transition:background 150ms ease,color 150ms ease,transform 120ms ease}
.btn-secondary-full:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.btn-secondary-full:active{transform:scale(0.99)}

<script>
(function () {
  /* ─── Exit modal ─── */
  const modal = document.getElementById('exit-modal');
  const closeBtn = document.querySelector('.topbar-close');
  if (modal && closeBtn) {
    closeBtn.addEventListener('click', e => {
      e.preventDefault();
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
    });
  }

  /* ─── Amount state ─── */
  let rawAmount = 0;
  const displayEl = document.getElementById('amount-display');
  const reviewBtn = document.getElementById('review-btn');

  /* Sync Review button state — both visual class + SPA nav target */
  function syncReview(amt) {
    const enabled = amt > 0;
    reviewBtn.classList.toggle('enabled', enabled);
    if (enabled) reviewBtn.dataset.navTo = './fund-review.html';
    else delete reviewBtn.dataset.navTo;
  }

  function flipTo(val) {
    const formatted = val > 0 ? '$' + val.toLocaleString() : '$';
    displayEl.classList.remove('anim-in');
    displayEl.classList.add('anim-out');
    setTimeout(() => {
      displayEl.value = formatted;
      displayEl.classList.toggle('has-value', val > 0);
      syncReview(val);
      displayEl.classList.remove('anim-out');
      displayEl.classList.add('anim-in');
      setTimeout(() => displayEl.classList.remove('anim-in'), 200);
    }, 110);
  }

  window.setAmount = function (val) {
    const newAmt = val === 'max' ? 8221 : val;
    rawAmount = newAmt;
    flipTo(newAmt);
  };

  displayEl.addEventListener('focus', function () {
    const num = this.value.replace(/[$,]/g, '');
    this.value = '$' + num;
    setTimeout(() => this.setSelectionRange(1, this.value.length), 0);
  });
  displayEl.addEventListener('keydown', function (e) {
    if (e.key === 'Backspace' && this.selectionStart === 1 && this.selectionEnd === 1) {
      e.preventDefault();
    }
  });
  displayEl.addEventListener('input', function () {
    const cursor = this.selectionStart;
    const num = this.value.replace(/[^0-9]/g, '');
    this.value = '$' + num;
    const pos = Math.max(1, cursor);
    try { this.setSelectionRange(pos, pos); } catch (_) {}
    rawAmount = parseInt(num) || 0;
    this.classList.toggle('has-value', rawAmount > 0);
    syncReview(rawAmount);
  });
  displayEl.addEventListener('blur', function () {
    if (rawAmount > 0) {
      this.value = '$' + rawAmount.toLocaleString();
      this.classList.add('has-value');
    } else {
      this.value = '$';
      this.classList.remove('has-value');
    }
  });

  /* ─── Repeat toggle ─── */
  const toggleEl  = document.getElementById('repeat-toggle');
  const freqPill  = document.getElementById('freq-pill');
  const startsRow = document.getElementById('starts-row');
  let repeatOn = false;
  toggleEl.addEventListener('click', () => {
    repeatOn = !repeatOn;
    toggleEl.classList.toggle('on', repeatOn);
    toggleEl.setAttribute('aria-pressed', String(repeatOn));
    freqPill.classList.toggle('visible', repeatOn);
    startsRow.classList.toggle('visible', repeatOn);
  });

  /* ─── Frequency dropdown ─── */
  const freqDropdown = document.getElementById('freq-dropdown');
  const freqLabel    = document.getElementById('freq-label');
  if (freqPill && freqDropdown) {
    freqPill.addEventListener('click', function(e) {
      e.stopPropagation();
      const open = freqDropdown.classList.toggle('open');
      freqPill.setAttribute('aria-expanded', open);
    });
    freqDropdown.querySelectorAll('.freq-option').forEach(function(opt) {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        freqDropdown.querySelectorAll('.freq-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        freqLabel.textContent = opt.dataset.value;
        freqDropdown.classList.remove('open');
        freqPill.setAttribute('aria-expanded', 'false');
      });
    });
  }

  /* ─── Date picker ─── */
  const startsTrigger = document.getElementById('starts-trigger');
  const startsLabel   = document.getElementById('starts-label');
  const dpPopover     = document.getElementById('dp-popover');
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const today = new Date(); today.setHours(0,0,0,0);
  let dpYear = today.getFullYear(), dpMonth = today.getMonth();
  let selectedDate = null;

  function sameDay(a,b){ return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

  function renderCalendar() {
    const firstDow = new Date(dpYear, dpMonth, 1).getDay();
    const daysInMonth = new Date(dpYear, dpMonth+1, 0).getDate();
    let html = `<div class="dp-header">
      <button class="dp-nav" id="dp-prev" type="button" aria-label="Previous month">
        <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="160 208 80 128 160 48"/></svg>
      </button>
      <span class="dp-month-label">${MONTHS[dpMonth]} ${dpYear}</span>
      <button class="dp-nav" id="dp-next" type="button" aria-label="Next month">
        <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="96 48 176 128 96 208"/></svg>
      </button>
    </div>
    <div class="dp-weekdays">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="dp-weekday">${d}</div>`).join('')}</div>
    <div class="dp-days">`;
    for(let i=0;i<firstDow;i++) html+=`<button class="dp-day dp-empty" type="button" tabindex="-1"></button>`;
    for(let d=1;d<=daysInMonth;d++){
      const dt = new Date(dpYear,dpMonth,d); dt.setHours(0,0,0,0);
      const isPast = dt < today;
      const isToday = sameDay(dt,today);
      const isSel = selectedDate ? sameDay(dt,selectedDate) : isToday;
      let cls='dp-day';
      if(isToday) cls+=' dp-today';
      if(isSel) cls+=' dp-selected';
      html+=`<button class="${cls}" type="button" data-y="${dpYear}" data-m="${dpMonth}" data-d="${d}"${isPast?' disabled':''} aria-label="${MONTHS[dpMonth]} ${d}, ${dpYear}">${d}</button>`;
    }
    html+=`</div>`;
    dpPopover.innerHTML = html;
    document.getElementById('dp-prev').addEventListener('click', function(e){ e.stopPropagation(); dpMonth--; if(dpMonth<0){dpMonth=11;dpYear--;} renderCalendar(); });
    document.getElementById('dp-next').addEventListener('click', function(e){ e.stopPropagation(); dpMonth++; if(dpMonth>11){dpMonth=0;dpYear++;} renderCalendar(); });
    dpPopover.querySelectorAll('.dp-day:not(.dp-empty)').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        selectedDate = new Date(+btn.dataset.y, +btn.dataset.m, +btn.dataset.d); selectedDate.setHours(0,0,0,0);
        startsLabel.textContent = sameDay(selectedDate,today) ? 'Starts today' : 'Starts '+MONTH_SHORT[selectedDate.getMonth()]+' '+selectedDate.getDate();
        dpPopover.classList.remove('open');
      });
    });
  }

  if(startsTrigger && dpPopover){
    startsTrigger.addEventListener('click', function(e){
      e.stopPropagation();
      const open = dpPopover.classList.toggle('open');
      if(open){ dpYear=today.getFullYear(); dpMonth=today.getMonth(); renderCalendar(); }
    });
  }

  /* ─── Close all on outside click / Escape ─── */
  document.addEventListener('click', function(){
    if(freqDropdown) freqDropdown.classList.remove('open');
    if(dpPopover) dpPopover.classList.remove('open');
    const bd = document.getElementById('broker-dropdown');
    if(bd) bd.classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      if(freqDropdown) freqDropdown.classList.remove('open');
      if(dpPopover) dpPopover.classList.remove('open');
      const bd = document.getElementById('broker-dropdown');
      if(bd) bd.classList.remove('open');
    }
  });

  /* ─── Broker dropdown ─── */
  const brokerBtn       = document.getElementById('broker-select-btn');
  const brokerDropdown  = document.getElementById('broker-dropdown');
  const brokerNameEl    = document.getElementById('broker-name');
  const brokerAvatarImg = document.getElementById('broker-avatar-img');
  const availableEl     = document.getElementById('available-text');

  function formatBalance(num) {
    return '$' + num.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' Available';
  }

  if (brokerBtn && brokerDropdown) {
    brokerBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const open = brokerDropdown.classList.toggle('open');
      brokerBtn.setAttribute('aria-expanded', String(open));
    });
    brokerDropdown.querySelectorAll('.broker-option').forEach(function(opt) {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        brokerDropdown.querySelectorAll('.broker-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        brokerNameEl.textContent   = opt.dataset.name;
        brokerAvatarImg.src        = opt.dataset.img;
        brokerAvatarImg.alt        = opt.dataset.name;
        availableEl.textContent    = formatBalance(parseFloat(opt.dataset.balance));
        brokerDropdown.classList.remove('open');
        brokerBtn.setAttribute('aria-expanded', 'false');
      });
    });
  }
})();
</script>

</body>
</html>
