<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy / Sell — Surmount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,select{font-family:inherit;border:none;background:none;color:inherit}
input:focus{outline:none}

:root{
  --color-bg-primary:#ffffff;
  --color-bg-secondary:#f5f6f8;
  --color-fg-primary-900:#181d27;
  --color-fg-secondary-700:#414651;
  --color-fg-tertiary-600:#535862;
  --color-fg-quaternary-400:#a3a7ae;
  --color-border-primary:rgba(0,0,0,0.086);
  --color-border-secondary:rgba(0,0,0,0.06);
  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-xs:12px;
  --font-size-text-sm:14px;
  --font-size-text-md:16px;
  --font-size-text-lg:18px;
  --radius-md:8px;
  --radius-xl:12px;
  --radius-2xl:16px;
  --radius-full:9999px;
  --spacing-xs:4px;
  --spacing-sm:6px;
  --spacing-md:8px;
  --spacing-lg:12px;
  --spacing-xl:16px;
  --spacing-2xl:20px;
  --spacing-3xl:24px;
  --spacing-4xl:32px;
}

html,body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#ebebed;
  font-family:var(--font-family-body);
  -webkit-font-smoothing:antialiased;
}

/* ── Outer shell ── */
.shell{
  width:420px;
  display:flex;flex-direction:column;gap:0;
  background:#e8e9ec;
  border:1px solid rgba(0,0,0,0.09);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(10,13,18,0.1),0 0 0 0.5px rgba(0,0,0,0.06);
}

/* ── Main card ── */
.card{
  background:var(--color-bg-primary);
  border-radius:22px;
  padding:var(--spacing-3xl) var(--spacing-3xl) var(--spacing-2xl);
  display:flex;flex-direction:column;gap:0;
}

/* ── Tab row ── */
.tabs{
  display:grid;grid-template-columns:1fr 1fr;
  margin-bottom:var(--spacing-3xl);
  border-bottom:1px solid var(--color-border-secondary);
}
.tab{
  padding:var(--spacing-md) 0 var(--spacing-lg);
  text-align:center;
  font-size:var(--font-size-text-md);font-weight:500;
  color:var(--color-fg-quaternary-400);
  cursor:pointer;position:relative;
  transition:color 0.15s ease;letter-spacing:-0.3px;
}
.tab.active{color:var(--color-fg-primary-900)}
.tab.active::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:2px;background:var(--color-fg-primary-900);border-radius:2px 2px 0 0;
}

/* ── Form rows ── */
.form-rows{
  display:flex;flex-direction:column;gap:var(--spacing-xl);
  margin-bottom:var(--spacing-3xl);
}
.form-row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-lg);
}
.row-label{
  font-size:var(--font-size-text-sm);font-weight:400;
  color:var(--color-fg-tertiary-600);letter-spacing:-0.2px;
  flex-shrink:0;
}

/* Dropdown control */
.ctrl-dropdown{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--spacing-md);
  padding:11px var(--spacing-xl);
  background:var(--color-bg-secondary);
  border-radius:var(--radius-xl);
  font-size:var(--font-size-text-sm);font-weight:500;
  color:var(--color-fg-primary-900);letter-spacing:-0.2px;
  cursor:pointer;min-width:180px;
  transition:background 0.12s ease;
}
.ctrl-dropdown:hover{background:#eeeff1}
.ctrl-dropdown svg{width:14px;height:14px;color:var(--color-fg-tertiary-600);flex-shrink:0}

/* Toggle control */
.ctrl-toggle{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--spacing-md);
  padding:11px var(--spacing-xl);
  background:var(--color-bg-secondary);
  border-radius:var(--radius-xl);
  font-size:var(--font-size-text-sm);font-weight:500;
  color:var(--color-fg-primary-900);letter-spacing:-0.2px;
  cursor:pointer;min-width:180px;
  transition:background 0.12s ease;
}
.ctrl-toggle:hover{background:#eeeff1}
.ctrl-toggle svg{width:14px;height:14px;color:var(--color-fg-tertiary-600);flex-shrink:0}

/* Amount input */
.ctrl-input{
  display:flex;align-items:center;
  background:var(--color-bg-secondary);
  border-radius:var(--radius-xl);
  overflow:hidden;min-width:180px;
}
.ctrl-input input{
  flex:1;padding:11px var(--spacing-xl);
  font-size:var(--font-size-text-sm);font-weight:400;
  color:var(--color-fg-tertiary-600);letter-spacing:-0.2px;
  background:transparent;width:0;min-width:0;
}
.ctrl-input-divider{width:1px;height:20px;background:var(--color-border-secondary);flex-shrink:0}
.max-btn{
  padding:11px var(--spacing-xl);
  font-size:var(--font-size-text-sm);font-weight:500;
  color:var(--color-fg-primary-900);letter-spacing:-0.2px;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:color 0.12s ease;
  background:var(--color-bg-primary);
}
.max-btn:hover{color:var(--color-fg-secondary-700)}

/* ── Divider ── */
.divider{
  height:1px;background:var(--color-border-secondary);
  margin-bottom:var(--spacing-xl);
}

/* ── Cost row ── */
.cost-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--spacing-2xl);
}
.cost-label{
  font-size:var(--font-size-text-sm);font-weight:400;
  color:var(--color-fg-tertiary-600);letter-spacing:-0.2px;
}
.cost-value{
  font-size:var(--font-size-text-sm);font-weight:500;
  color:var(--color-fg-primary-900);letter-spacing:-0.2px;
}

/* ── Next button ── */
.next-btn{
  width:100%;
  padding:15px var(--spacing-3xl);
  background:#8a9099;
  color:#fff;
  border-radius:var(--radius-full);
  font-size:var(--font-size-text-md);font-weight:500;
  letter-spacing:-0.3px;
  cursor:not-allowed;opacity:1;
  transition:background 0.15s ease;
}

/* ── Account section ── */
.account-section{
  padding:var(--spacing-xl) var(--spacing-3xl);
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;
  transition:background 0.12s ease;
}
.account-section:hover{background:rgba(0,0,0,0.02)}
.account-left{display:flex;flex-direction:column;gap:3px}
.account-name-row{display:flex;align-items:center;gap:var(--spacing-md)}
.account-name{
  font-size:var(--font-size-text-sm);font-weight:500;
  color:var(--color-fg-primary-900);letter-spacing:-0.2px;
}
.default-badge{
  display:inline-flex;align-items:center;
  padding:2px var(--spacing-md);
  background:rgba(0,0,0,0.07);
  border-radius:var(--radius-full);
  font-size:var(--font-size-text-xs);font-weight:400;
  color:var(--color-fg-tertiary-600);letter-spacing:-0.1px;
}
.account-balance{
  font-size:var(--font-size-text-xs);font-weight:400;
  color:var(--color-fg-quaternary-400);letter-spacing:-0.1px;
}
.account-caret svg{
  width:14px;height:14px;color:var(--color-fg-quaternary-400);
}
</style>
</head>
<body>

<div class="shell">

  <!-- Main card -->
  <div class="card">

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active">Buy</div>
      <div class="tab">Sell</div>
    </div>

    <!-- Form rows -->
    <div class="form-rows">
      <div class="form-row">
        <span class="row-label">Order type</span>
        <div class="ctrl-dropdown">
          Market buy
          <svg viewBox="0 0 256 256" fill="currentColor">
            <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/>
          </svg>
        </div>
      </div>

      <div class="form-row">
        <span class="row-label">Buy in</span>
        <div class="ctrl-toggle">
          Shares
          <svg viewBox="0 0 256 256" fill="currentColor">
            <path d="M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z"/>
          </svg>
        </div>
      </div>

      <div class="form-row">
        <span class="row-label">Shares</span>
        <div class="ctrl-input">
          <input type="text" value="0" readonly>
          <div class="ctrl-input-divider"></div>
          <button class="max-btn">Max</button>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Estimated cost -->
    <div class="cost-row">
      <span class="cost-label">Estimated cost</span>
      <span class="cost-value">$0.00 USD</span>
    </div>

    <!-- Next button -->
    <button class="next-btn">Next</button>

  </div>

  <!-- Account row -->
  <div class="account-section">
    <div class="account-left">
      <div class="account-name-row">
        <span class="account-name">TFSA</span>
        <span class="default-badge">Default</span>
      </div>
      <span class="account-balance">$4,811.74 CAD · $0.07 USD</span>
    </div>
    <div class="account-caret">
      <svg viewBox="0 0 256 256" fill="currentColor">
        <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/>
      </svg>
    </div>
  </div>

</div>

<script>
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    tab.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});
</script>
</body>
</html>
