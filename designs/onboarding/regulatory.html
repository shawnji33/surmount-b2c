<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}

:root{
  --color-bg-primary:#ffffff;
  --color-bg-primary-hover:#fafafa;
  --color-bg-secondary:#fafafa;
  --color-bg-success-solid:#3b7e3f;

  --color-fg-primary-900:#181d27;
  --color-fg-secondary-700:#414651;
  --color-fg-secondary-hover:#252b37;
  --color-fg-tertiary-600:#535862;
  --color-fg-quaternary-400:#a4a7ae;
  --color-fg-disabled:#a4a7ae;
  --color-fg-disabled-subtle:#d5d7da;

  --color-text-primary-900:#181d27;
  --color-text-secondary-700:rgba(10,13,18,0.7);
  --color-text-secondary-hover:rgba(10,13,18,0.8);
  --color-text-tertiary-600:#535861;
  --color-text-white:#ffffff;

  --color-border-primary:#00000017;
  --color-border-focus:#0a0d123d;
  --color-border-disabled-subtle:#e9e9eb;

  --color-bg-disabled:#f5f5f5;
  --color-bg-disabled-subtle:#fafafa;

  --color-utility-gray-50:#fafafa;
  --color-utility-brand-50:#f1f6fd;
  --color-utility-brand-200:#c8dbf5;
  --color-utility-brand-700:#3757be;

  --spacing-xxs:2px; --spacing-xs:4px; --spacing-sm:6px;
  --spacing-md:8px;  --spacing-lg:12px; --spacing-xl:16px;
  --spacing-2xl:20px; --spacing-3xl:24px; --spacing-4xl:32px;
  --spacing-5xl:40px; --spacing-6xl:48px; --spacing-7xl:64px;

  --radius-sm:6px; --radius-md:8px; --radius-xl:12px; --radius-2xl:16px; --radius-full:9999px;

  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-xs:12px;  --line-height-text-xs:18px;
  --font-size-text-sm:14px;  --line-height-text-sm:20px;
  --font-size-text-md:16px;  --line-height-text-md:24px;
  --font-size-text-lg:18px;  --line-height-text-lg:28px;
  --font-size-display-xs:24px; --line-height-display-xs:32px;
  --font-size-display-sm:30px; --line-height-display-sm:38px;
}

html,body{height:100%}
body{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);
  color:var(--color-fg-primary-900);
  background:var(--color-utility-gray-50);
  letter-spacing:-0.5px;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--spacing-xl) var(--spacing-3xl);
  background:var(--color-utility-gray-50);
}
.topbar-back,.topbar-close{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-md);
  color:var(--color-text-secondary-700);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
  transition:background 150ms ease,color 150ms ease;
}
.topbar-back:hover,.topbar-close:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.topbar-back:active,.topbar-close:active{transform:scale(0.97)}
.topbar-back svg,.topbar-close svg{width:20px;height:20px;flex-shrink:0}
.topbar-brand{
  display:flex;align-items:center;gap:var(--spacing-md);
  color:var(--color-fg-primary-900);
}
.topbar-brand svg{width:28px;height:28px;display:block}
.topbar-brand-name{
  font-family:var(--font-family-display);
  font-size:20px;font-weight:500;letter-spacing:-0.4px;
}

main{
  flex:1;display:grid;place-items:center;
  padding:var(--spacing-3xl);
  min-height:0;
}
.stack{
  display:flex;flex-direction:column;align-items:center;
  gap:var(--spacing-5xl);
  width:100%;max-width:520px;
}
.hero{
  display:flex;flex-direction:column;align-items:center;gap:var(--spacing-md);
  text-align:center;width:100%;
}
.title{
  font-family:var(--font-family-body);
  font-size:var(--font-size-display-sm);font-weight:500;
  line-height:var(--line-height-display-sm);letter-spacing:-0.8px;
  color:var(--color-fg-primary-900);
}

/* ─── Checkbox group (interaction-states.md conformant) ──────────────── */
.check-group{
  display:flex;flex-direction:column;gap:var(--spacing-lg);width:100%;
  border:0;padding:0;margin:0;
}
.check-row{
  display:flex;align-items:flex-start;gap:var(--spacing-lg);
  padding:var(--spacing-xl) var(--spacing-xl);min-height:64px;
  background:var(--color-bg-primary);
  border:1px solid var(--color-border-primary);
  border-radius:var(--radius-xl);
  cursor:pointer;
  transition:background 150ms ease,border-color 150ms ease,box-shadow 150ms ease;
}
.check-row:hover{background:var(--color-bg-primary-hover)}
/* Selected — persistent. bg fill + filled checkbox are the signal. */
.check-row:has(input[type="checkbox"]:checked){
  background:var(--color-bg-secondary);
}
/* Focus-visible — keyboard only, independent of selection. */
.check-row:has(input[type="checkbox"]:focus-visible){
  border-color:var(--color-border-focus);
  box-shadow:0 0 0 3px rgba(10,13,18,0.08);
}
.check-row input[type="checkbox"]{
  -webkit-appearance:none;appearance:none;
  flex:none;
  width:20px;height:20px;
  border:1.5px solid var(--color-border-primary);
  border-radius:var(--radius-sm);
  background:var(--color-bg-primary);
  display:inline-grid;place-items:center;cursor:pointer;
  margin-top:2px;
  transition:background 150ms ease,border-color 150ms ease;
  outline:none;
}
.check-row input[type="checkbox"]:checked{
  background:var(--color-fg-primary-900);
  border-color:var(--color-fg-primary-900);
}
.check-row input[type="checkbox"]:checked::after{
  content:"";
  width:12px;height:12px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' fill='none' stroke='white' stroke-width='32' stroke-linecap='round' stroke-linejoin='round'><polyline points='40 128 104 192 224 72'/></svg>") center/contain no-repeat;
}
/* Disabled state — per interaction-states.md: dimmed, no hover, no cursor */
.check-row:has(input[type="checkbox"]:disabled){
  background:var(--color-bg-disabled-subtle);
  cursor:not-allowed;
}
.check-row:has(input[type="checkbox"]:disabled):hover{
  background:var(--color-bg-disabled-subtle);
}
.check-row:has(input[type="checkbox"]:disabled) .check-label{
  color:var(--color-fg-disabled);
}
.check-row input[type="checkbox"]:disabled{
  cursor:not-allowed;
  background:var(--color-bg-disabled);
  border-color:var(--color-border-disabled-subtle);
}
.check-label{
  flex:1;min-width:0;
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:0;
  color:var(--color-fg-primary-900);
}
/* DS Badge — variant=pill, size=sm, color=brand */
.badge{
  flex-shrink:0;align-self:center;
  display:inline-flex;align-items:center;
  padding:var(--spacing-xxs) var(--spacing-md);
  border-radius:var(--radius-full);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-xs);font-weight:500;
  line-height:var(--line-height-text-xs);letter-spacing:0;
  white-space:nowrap;
}
.badge-brand{
  background:var(--color-utility-brand-50);
  border:1px solid var(--color-utility-brand-200);
  color:var(--color-utility-brand-700);
}

/* ─── Primary Button (Size=lg, Hierarchy=Primary) ─────────────────────── */
.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);
  padding:10px var(--spacing-xl);
  background:var(--color-fg-primary-900);
  color:var(--color-text-white);
  border:2px solid rgba(255,255,255,0.12);
  border-radius:var(--radius-md);
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);font-weight:500;
  line-height:var(--line-height-text-md);letter-spacing:-0.2px;
  transition:background 150ms ease,transform 120ms ease;
  min-width:160px;
}
.cta:hover{background:var(--color-fg-secondary-hover)}
.cta:active{transform:scale(0.99)}
.cta svg{width:20px;height:20px}

/* ─── Exit modal ─────────────────────────────────────────────────────── */
.modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--spacing-xl)}
.modal-root[hidden]{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,13,18,0.55);animation:modalFade 180ms ease-out}
.modal-card{position:relative;background:var(--color-bg-primary);border-radius:20px;box-shadow:0 24px 48px -8px rgba(10,13,18,0.22);width:100%;max-width:420px;padding:var(--spacing-4xl);display:flex;flex-direction:column;gap:var(--spacing-3xl);animation:modalIn 220ms cubic-bezier(.22,.61,.36,1)}
.modal-dismiss{position:absolute;top:var(--spacing-xl);right:var(--spacing-xl);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--color-fg-tertiary-600);transition:background 150ms ease,color 150ms ease}
.modal-dismiss:hover{background:var(--color-bg-primary-hover);color:var(--color-fg-primary-900)}
.modal-dismiss svg{width:18px;height:18px}
.modal-body{display:flex;flex-direction:column;gap:var(--spacing-md);padding-right:var(--spacing-4xl)}
.modal-title{font-family:var(--font-family-body);font-size:20px;font-weight:500;line-height:30px;letter-spacing:-0.4px;color:var(--color-fg-primary-900)}
.modal-desc{font-family:var(--font-family-body);font-size:var(--font-size-text-sm);font-weight:400;line-height:var(--line-height-text-sm);letter-spacing:0;color:var(--color-fg-tertiary-600)}
.modal-actions{display:flex;flex-direction:column;gap:var(--spacing-md)}
.btn-primary-full{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);padding:10px var(--spacing-xl);width:100%;background:var(--color-fg-primary-900);color:var(--color-text-white);border:2px solid rgba(255,255,255,0.12);border-radius:var(--radius-md);font-family:var(--font-family-body);font-size:var(--font-size-text-md);font-weight:500;line-height:var(--line-height-text-md);letter-spacing:0;transition:background 150ms ease,transform 120ms ease}
.btn-primary-full:hover{background:var(--color-fg-secondary-hover)}
.btn-primary-full:active{transform:scale(0.99)}
.btn-secondary-full{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-sm);padding:10px var(--spacing-xl);width:100%;background:var(--color-bg-primary);color:var(--color-text-secondary-700);border:1px solid var(--color-border-primary);border-radius:var(--radius-md);font-family:var(--font-family-body);font-size:var(--font-size-text-md);font-weight:500;line-height:var(--line-height-text-md);letter-spacing:0;transition:background 150ms ease,color 150ms ease,transform 120ms ease}
.btn-secondary-full:hover{background:var(--color-bg-primary-hover);color:var(--color-text-secondary-hover)}
.btn-secondary-full:active{transform:scale(0.99)}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important}
  .modal-backdrop,.modal-card{animation:none !important}
}
</style>
</head>

<script>
(function(){
  // Exit modal
  const modal = document.getElementById('exit-modal');
  const closeBtn = document.querySelector('.topbar-close');
  if (modal && closeBtn) {
    const open = () => { modal.hidden = false; document.body.style.overflow = 'hidden'; };
    const dismiss = () => { modal.hidden = true; document.body.style.overflow = ''; };
    closeBtn.addEventListener('click', e => { e.preventDefault(); open(); });
    modal.addEventListener('click', e => { if (e.target.closest('[data-modal-dismiss]')) dismiss(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) dismiss(); });
  }

  // One-way: when "None of these apply" is checked, the three specific
  // situations are unchecked + disabled. The top three never affect "None".
  const none = document.querySelector('input[name="sit-none"]');
  const others = Array.from(document.querySelectorAll('input[type="checkbox"]')).filter(
    c => c !== none && c.name && c.name.startsWith('sit-'),
  );
  if (!none || others.length === 0) return;

  none.addEventListener('change', () => {
    if (none.checked) {
      others.forEach(c => { c.checked = false; c.disabled = true; });
    } else {
      others.forEach(c => { c.disabled = false; });
    }
  });

  // Compliance modal — appears when the user proceeds with any of the three
  // specific situations checked. Confirming continues the flow; cancelling
  // dismisses the modal and leaves the user on this screen.
  const compModal = document.getElementById('compliance-modal');
  const nextBtn   = document.getElementById('reg-next');
  const confirmBtn = document.getElementById('compliance-confirm');
  const NEXT_HREF = './investing-style.html';

  function anyRegulated(){ return others.some(c => c.checked); }
  function openComp(){ compModal.hidden = false; document.body.style.overflow = 'hidden'; }
  function closeComp(){ compModal.hidden = true; document.body.style.overflow = ''; }

  if (nextBtn){
    nextBtn.addEventListener('click', () => {
      if (anyRegulated()) openComp();
      else location.href = NEXT_HREF;
    });
  }
  if (compModal){
    compModal.addEventListener('click', e => {
      if (e.target.closest('[data-modal-dismiss]')) closeComp();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !compModal.hidden) closeComp();
    });
  }
  if (confirmBtn){
    confirmBtn.addEventListener('click', () => { location.href = NEXT_HREF; });
  }
})();
</script>

</body>
</html>
