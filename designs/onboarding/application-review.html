<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application under review — Surmount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block}

:root{
  --color-bg-primary:#ffffff;
  --color-bg-secondary:#fafafa;
  --color-fg-primary-900:#181d27;
  --color-fg-secondary-700:#414651;
  --color-fg-tertiary-600:#535862;
  --color-fg-white:#ffffff;
  --color-text-white:#ffffff;

  --color-border-primary:#00000017;
  --color-border-tertiary:#0000000a;

  --color-utility-gray-50:#fafafa;
  --color-utility-brand-900:#2d3f7b;
  --color-utility-brand-800:#32499b;
  --color-utility-brand-700:#3757be;
  --color-utility-brand-600:#406ad0;
  --color-utility-brand-400:#75a5e5;
  --color-utility-brand-300:#8eb8eb;
  --color-utility-brand-200:#c8dbf5;
  --color-utility-brand-100:#e0eaf9;
  --color-utility-brand-50:#f1f6fd;

  --spacing-xxs:2px; --spacing-xs:4px; --spacing-sm:6px;
  --spacing-md:8px;  --spacing-lg:12px; --spacing-xl:16px;
  --spacing-2xl:20px; --spacing-3xl:24px; --spacing-4xl:32px;
  --spacing-5xl:40px; --spacing-6xl:48px; --spacing-7xl:64px;

  --radius-md:8px; --radius-xl:12px; --radius-2xl:16px; --radius-full:9999px;

  --font-family-body:'Geist',sans-serif;
  --font-family-display:'Inter',sans-serif;
  --font-size-text-xs:12px;  --line-height-text-xs:18px;
  --font-size-text-sm:14px;  --line-height-text-sm:20px;
  --font-size-text-md:16px;  --line-height-text-md:24px;
  --font-size-text-lg:18px;  --line-height-text-lg:28px;
  --font-size-display-xs:24px; --line-height-display-xs:32px;
  --font-size-display-sm:30px; --line-height-display-sm:38px;
}

html{height:100%}
body{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-md);
  color:var(--color-fg-primary-900);
  background:var(--color-utility-gray-50);
  letter-spacing:-0.5px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:var(--spacing-4xl);
}

/* ─── Card ──────────────────────────────────────────────────────────────── */
.review-card{
  width:100%;
  max-width:680px;
  background:var(--color-utility-brand-900);
  border-radius:var(--radius-2xl);
  padding:var(--spacing-3xl) var(--spacing-4xl);
  display:flex;
  align-items:center;
  gap:var(--spacing-3xl);
  cursor:pointer;
  transition:background 0.15s ease;
}
.review-card:hover{
  background:var(--color-utility-brand-800);
}

.review-body{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:var(--spacing-md);
  min-width:0;
}

.review-label{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-xs);
  font-weight:500;
  line-height:var(--line-height-text-xs);
  letter-spacing:0.02em;
  color:var(--color-utility-brand-300);
}

.review-heading{
  font-family:var(--font-family-display);
  font-size:var(--font-size-display-xs);
  font-weight:500;
  line-height:var(--line-height-display-xs);
  letter-spacing:-0.5px;
  color:var(--color-fg-white);
}

/* ─── Progress bar ───────────────────────────────────────────────────────── */
.progress-track{
  display:flex;
  gap:6px;
  align-items:center;
}
.progress-segment{
  flex:1;
  height:4px;
  border-radius:var(--radius-full);
  background:rgba(255,255,255,0.2);
}
.progress-segment.active{
  background:var(--color-fg-white);
}

.review-caption{
  font-family:var(--font-family-body);
  font-size:var(--font-size-text-sm);
  font-weight:400;
  line-height:var(--line-height-text-sm);
  letter-spacing:-0.3px;
  color:var(--color-utility-brand-300);
}

/* ─── Chevron ────────────────────────────────────────────────────────────── */
.review-chevron{
  flex-shrink:0;
  width:20px;
  height:20px;
  color:rgba(255,255,255,0.35);
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>
</head>
<body>

<div class="review-card">
  <div class="review-body">
    <span class="review-label">Account setup</span>
    <h2 class="review-heading">Your application is under review</h2>
    <div class="progress-track">
      <div class="progress-segment active"></div>
      <div class="progress-segment"></div>
      <div class="progress-segment"></div>
      <div class="progress-segment"></div>
    </div>
    <p class="review-caption">25% complete · Usually within 1–2 business days</p>
  </div>
  <div class="review-chevron">
    <!-- Phosphor ChevronRight Regular -->
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor">
      <path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/>
    </svg>
  </div>
</div>

</body>
</html>
